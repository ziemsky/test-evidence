  // ---------------------------------------------------------------------
  // Save (SPEC §5): primary = in-place via File System Access (§5.1),
  // fallback = whole-file download (§5.2). 0020.
  // ---------------------------------------------------------------------

  // ---------------------------------------------------------------------
  // 0021: screenshot paste (SPEC §6)
  // ---------------------------------------------------------------------

  function fileToPng(file) {
    return createImageBitmap(file).then(function (bitmap) {
      var canvas = document.createElement('canvas');
      canvas.width = bitmap.width;
      canvas.height = bitmap.height;
      canvas.getContext('2d').drawImage(bitmap, 0, 0);
      if (typeof bitmap.close === 'function') bitmap.close();
      return new Promise(function (resolve, reject) {
        canvas.toBlob(function (blob) {
          if (blob) resolve(blob);
          else reject(new Error('PNG encode failed'));
        }, 'image/png');
      });
    });
  }

  function blobToDataUrl(blob) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onloadend = function () { resolve(reader.result); };
      reader.onerror = function () { reject(reader.error); };
      reader.readAsDataURL(blob);
    });
  }

  function shotStamp(d) {
    var p = function (n) { return String(n).padStart(2, '0'); };
    return String(d.getFullYear()) + p(d.getMonth() + 1) + p(d.getDate()) + '-' +
      p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
  }

  async function pasteScreenshot(file, placeholder, operation) {
    // Same gesture guard as save (§5.1): 'granted' here → PNG written to
    // assets/ on disk; otherwise this one image degrades to a data-URL and
    // the session keeps working (§6.5). Either way the placeholder is
    // replaced; only hard failures keep it (§6.7).
    var granted = mode === 'primary' && (await ensurePermission());
    try {
      var png = await fileToPng(file);
      if (granted && !assetsDir) assetsDir = await dirHandle.getDirectoryHandle('assets', { create: true });
      var name = await pickShotName(granted);
      var item = makeScreenshot('', 'medium');
      var img = item.querySelector(':scope > img.ev-img');
      if (granted) {
        var fh = await assetsDir.getFileHandle(name, { create: true });
        var writable = await fh.createWritable();
        await writable.write(png);
        await writable.close();
        img.src = 'assets/' + name; // relative, never absolute (§2)
      } else {
        img.src = await blobToDataUrl(png);
      }
      // 0051 (SPEC §23.1/§6.6): the new shot joins the row that held the
      // placeholder; a placeholder that sat in the body (the section had no
      // rows) becomes a plain single-shot row on paste.
      if (placeholder.parentElement && placeholder.parentElement.matches('.ev-shot-row')) {
        placeholder.replaceWith(item);
      } else {
        var shotRow = makeShotRow();
        shotRow.appendChild(item);
        placeholder.replaceWith(shotRow);
        ensureShotRowChrome(shotRow); // the new row comes up with its (hidden) strip
      }
      ensureFilenameLabel(item, img); // 0063 (§26): the label appears with the asset
      refreshScreenshotActions(item); // 0066 (§27): the asset-backed palette gains rename file
      updateScreenshotSizeControls(item);
      usedNames.add(name);
      completeOperation(operation, 'Screenshot pasted', 'success');
    } catch (err) {
      // keep the placeholder: the tester can paste again
      completeOperation(operation, 'Screenshot failed — ' + (err && err.message ? err.message : String(err)), 'error');
    }
  }

  async function pickShotName(granted) {
    var stamp = shotStamp(new Date());
    var candidate = 'shot-' + stamp + '.png';
    var counter = 0;
    for (;;) {
      if (await shotNameIsFree(candidate, granted)) return candidate;
      counter += 1;
      candidate = 'shot-' + stamp + '-' + counter + '.png';
    }
  }

  async function shotNameIsFree(name, granted) {
    if (granted) {
      // "free" = probing the assets dir (getFileHandle, no create) (§6.4)
      try {
        await assetsDir.getFileHandle(name);
        return false;
      } catch { return true; }
    }
    return !usedNames.has(name);
  }

  var fileSystemAccessSupported = typeof self.showDirectoryPicker === 'function';
  var mode = fileSystemAccessSupported && typeof self.indexedDB !== 'undefined'
    ? 'primary'
    : 'fallback'; // §12: in-place save needs both the picker and persistent handle storage
  var dirHandle = null; // picked/remembered folder
  var fileHandle = null; // derived: <dir>/<basename of location.pathname>
  var assetsDir = null; // derived: <dir>/assets
  var hasExplainedSaveDirectory = false;
  // 0021: used-image-names (SPEC §4.5, §6.4). Seeded at boot from all
  // img[src^="assets/"]; "free" in fallback mode = not in this set. Primary
  // mode probes the assets dir instead (§6.4).
  var usedNames = new Set();

  // Declined first-save picker (SPEC §12): download mode for the rest of this
  // session; re-opening the file re-enters the primary flow (re-detects at boot).
  function switchToFallback() {
    mode = 'fallback';
    dirHandle = null;
    fileHandle = null;
    assetsDir = null;
    refreshFileButtons();
    refreshRenameButtons();
    refreshFileSystemDependentButtons();
  }

  // The single guard over every FS operation (save, 0021 image write on
  // paste, 0022 image copy): true only when 'granted' is obtained within the
  // calling gesture. An operation that cannot obtain 'granted' degrades per
  // its own ticket.
  async function ensurePermission() {
    if (!dirHandle) return false;
    var state = await dirHandle.queryPermission({ mode: 'readwrite' });
    if (state === 'granted') return true;
    if (state === 'prompt') {
      state = await dirHandle.requestPermission({ mode: 'readwrite' });
      if (state === 'granted') return true;
    }
    return false;
  }

  // IndexedDB (SPEC §5.1.2): DB `evidence-capture`, store `handles`.
  // `file://` documents share an origin, so the key must include the document
  // URL; otherwise a second local copy inherits the first copy's folder.
  function documentHandleKey() {
    return 'evidence-root:' + (location.href || '').split('#')[0];
  }

  // Chromium remembers the last directory for a picker by origin + id. Keep
  // one shared id so a new local copy starts its first picker in the most
  // recently selected directory. The actual directory handle remains scoped
  // per document by documentHandleKey().
  function pickerId() {
    return 'evidence-root';
  }

  function idbOpen() {
    return new Promise(function (resolve, reject) {
      var req = indexedDB.open('evidence-capture');
      req.onupgradeneeded = function () { req.result.createObjectStore('handles'); };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
  }

  async function idbGetHandle() {
    var db = await idbOpen();
    try {
      return await new Promise(function (resolve, reject) {
        var req = db.transaction('handles', 'readwrite').objectStore('handles').get(documentHandleKey());
        req.onsuccess = function () { resolve(req.result || null); };
        req.onerror = function () { reject(req.error); };
      });
    } finally { db.close(); }
  }

  async function idbPutHandle(handle) {
    var db = await idbOpen();
    try {
      await new Promise(function (resolve, reject) {
        var req = db.transaction('handles', 'readwrite').objectStore('handles').put(handle, documentHandleKey());
        req.onsuccess = resolve;
        req.onerror = function () { reject(req.error); };
      });
    } finally { db.close(); }
  }

  function isPickerCancellation(err) {
    return !!err && (err.name === 'AbortError' || err.name === 'NotAllowedError');
  }

  // Save-gesture flow (§5.1): silent when permission can be obtained, else
  // exactly one directory picker. The shared `id` lets Chromium remember a
  // useful starting directory across local copies on file:// (research A2).
  // Returns
  // false when the session should drop to fallback (declined picker).
  async function acquireHandle(reportPickerErrors, explainSaveDirectory) {
    if (await ensurePermission()) return true;
    var picked;
    try {
      if (explainSaveDirectory && !hasExplainedSaveDirectory) {
        window.alert('In the next step, select the folder containing this HTML file.');
        hasExplainedSaveDirectory = true;
      }
      picked = await showDirectoryPicker({ mode: 'readwrite', id: pickerId() });
    } catch (err) {
      if (isPickerCancellation(err) || !reportPickerErrors) return false;
      throw err;
    }
    dirHandle = picked; // a new pick replaces the stored handle
    fileHandle = null;
    assetsDir = null;
    await idbPutHandle(picked);
    return true;
  }

  // 0059: copy one arbitrary source file into the session's shared assets
  // directory. Picker cancellation is deliberately silent; every other
  // failure is reported, and authored content changes only after close().
  async function assetExists(name) {
    try {
      await assetsDir.getFileHandle(name);
      return true;
    } catch (err) {
      if (err && err.name === 'NotFoundError') return false;
      throw err;
    }
  }

  // 0107 (SPEC §29): `anchor` is the triggering row toolbox's row — the
  // new file row lands immediately after it; a section-toolbox add passes
  // null and appends at the end of the body, as before.
  async function addFile(body, anchor, operation) {
    try {
      if (!(await acquireHandle(true))) return false;
      var picked;
      try {
        picked = await showOpenFilePicker({ multiple: false });
      } catch (err) {
        if (isPickerCancellation(err)) return false;
        throw err;
      }
      if (!picked || !picked[0]) return false;
      var source = await picked[0].getFile();
      if (!assetsDir) assetsDir = await dirHandle.getDirectoryHandle('assets', { create: true });
      if (await assetExists(source.name)) {
        var warning = 'An asset named "' + source.name + '" already exists. Overwrite it? ' +
          'Existing evidence that links to this name will use the replacement. ' +
          'Consider renaming the file before adding it.';
        if (!confirm(warning)) return false;
      }
      var target = await assetsDir.getFileHandle(source.name, { create: true });
      var writable = await target.createWritable();
      await writable.write(source);
      await writable.close();
      var fileRow = makeFile(source.name);
      if (anchor) anchor.insertAdjacentElement('afterend', fileRow);
      else body.appendChild(fileRow);
      renumber();
      alignProps();
      completeOperation(operation, 'File attached: ' + source.name, 'success');
    } catch (err) {
      completeOperation(operation, 'File not added — ' + (err && err.message ? err.message : String(err)), 'error');
    }
  }

  function basename() {
    var parts = (location.pathname || '').split('/').filter(Boolean);
    return parts.length ? parts[parts.length - 1] : 'index.html';
  }

  function formatTime(d) {
    var p = function (n) { return String(n).padStart(2, '0'); };
    return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }

  function serialize() {
    var clone = document.documentElement.cloneNode(true);
    // 0103: the current browser/device appearance is presentation chrome;
    // a saved evidence document must choose its appearance on the next visit.
    clone.removeAttribute('data-theme');
    clone.querySelectorAll('[data-chrome]').forEach(function (el) { el.remove(); });
    clone.querySelectorAll('[contenteditable]').forEach(function (el) {
      el.removeAttribute('contenteditable');
    });
    // §5.3.4: app-stamped markers are chrome, never content (0032's
    // data-depth; 0033's data-rail once it lands)
    clone.querySelectorAll('[data-depth], [data-rail]').forEach(function (el) {
      el.removeAttribute('data-depth');
      el.removeAttribute('data-rail');
    });
    clone.querySelectorAll('[data-palette-active]').forEach(function (el) {
      el.removeAttribute('data-palette-active');
    });
    clone.querySelectorAll('[data-print-hidden]').forEach(function (el) {
      el.removeAttribute('data-print-hidden');
    });
    clone.querySelectorAll('.ev-url[data-editing]').forEach(function (el) {
      el.removeAttribute('data-editing');
    });
    // §5.3.5: the alignment stamp (0036) — attribute + mirrored inline
    // property; the clamped-column marker (0038) is stripped with it
    clone.querySelectorAll('.ev-property[data-key-w]').forEach(function (el) {
      el.removeAttribute('data-key-w');
      el.style.removeProperty('--key-w');
    });
    clone.querySelectorAll('.ev-property[data-key-clamped]').forEach(function (el) {
      el.removeAttribute('data-key-clamped');
    });
    clone.querySelectorAll('.ev-property[data-value-multiline]').forEach(function (el) {
      el.removeAttribute('data-value-multiline');
    });
    clone.querySelectorAll('.ev-screenshot').forEach(function (el) {
      el.style.removeProperty('--ev-standalone-image-width');
      if (!el.getAttribute('style')) el.removeAttribute('style');
    });
    // 0069: shared evidence-column measurements are live layout chrome, not
    // authored document state. Remove them and drop the empty style
    // attribute so save -> reload -> save remains byte-stable.
    var savedEvidence = clone.querySelector('#evidence');
    if (savedEvidence) {
      ['--ev-gutter-width', '--ev-number-width', '--ev-number-gap', '--ev-content-start']
        .forEach(function (name) { savedEvidence.style.removeProperty(name); });
      if (!savedEvidence.getAttribute('style')) savedEvidence.removeAttribute('style');
    }
    // 0039 (SPEC §5.3/§19): the tab sync is one-way chrome — reset the
    // clone's <head> title so the synced title is never persisted; the
    // document title text appears exactly once, in the evidence root.
    var headTitle = clone.querySelector('head > title');
    if (headTitle) headTitle.textContent = 'Test Evidence';
    // 0044 (SPEC §5.3.7/§21): the TOC body-state marker is chrome — the
    // panel itself is gone with the data-chrome strip, but the body class
    // is not; a saved file carries no TOC state (every boot is expanded).
    var cloneBody = clone.querySelector('body');
    if (cloneBody) {
      cloneBody.classList.remove('toc-collapsed');
      // 0119: the open Help panel is browser chrome, never saved session state.
      cloneBody.classList.remove('help-open');
      cloneBody.classList.remove('panel-resizing');
      cloneBody.style.removeProperty('--ev-toc-expanded-width');
      cloneBody.style.removeProperty('--ev-help-panel-width');
      if (!cloneBody.getAttribute('style')) cloneBody.removeAttribute('style');
      // 0111 (SPEC §21): the shared drag machine's grabbing-cursor state is
      // chrome too — a save mid-drag carries no drag state
      cloneBody.classList.remove('ev-dragging-active');
      // an emptied class attribute serializes as class="" — drop it so the
      // saved file is state-free in both panel states
      if (cloneBody.classList.length === 0) cloneBody.removeAttribute('class');
    }
    return '<!DOCTYPE html>\n' + clone.outerHTML;
  }

  function saveDownload(operation) {
    var revision = revisionForSave();
    var blob = new Blob([serialize()], { type: 'text/html' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = basename();
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    markRevisionSaved(revision);
    finishSaveState();
    completeOperation(operation, 'Downloaded ' + formatTime(new Date()), 'success');
  }

  async function saveInPlace(operation) {
    if (!(await acquireHandle(false, saveRevision !== savedRevision))) {
      switchToFallback(); // declined → download mode for this session
      saveDownload(operation);
      return;
    }
    // Derived handles (§5.1.3). `create: true` is deliberate: a wrong-folder
    // pick writes a correctly-named copy there. Writing the document's own
    // file does not reload the page; images were written to disk at paste time
    // (§5.3).
    fileHandle = await dirHandle.getFileHandle(basename(), { create: true });
    assetsDir = await dirHandle.getDirectoryHandle('assets', { create: true });
    var revision = revisionForSave();
    var text = serialize();
    var writable = await fileHandle.createWritable();
    await writable.write(text);
    await writable.close();
    markRevisionSaved(revision);
    finishSaveState();
    completeOperation(operation, 'Saved ' + formatTime(new Date()), 'success');
  }

  function save(operation) {
    if (!fileSystemAccessSupported) return Promise.resolve();
    saveInProgress = true;
    updateSaveWarning();
    if (mode !== 'primary') {
      try {
        saveDownload(operation);
      } catch (err) {
        finishSaveState();
        throw err;
      }
      return Promise.resolve();
    }
    return saveInPlace(operation).catch(function (err) {
      finishSaveState();
      completeOperation(operation, 'Save failed — ' + (err && err.message ? err.message : String(err)), 'error');
    });
  }

  // ---------------------------------------------------------------------

  // The core move seam (0025) and the 0036 alignment seams: exposed so the
  // jsdom tests can drive them directly — the pointer handlers and canvas
  // measurement cannot be exercised in jsdom. moveElement(row, target,
  // before, opts) — 0055: for a SCREENSHOT dropped at a section-body gap,
  // opts.isolated forces the spatially isolated outcome (a new single-image
  // row at the gap, even where the 0054 DOM-adjacency baseline would join
  // the row the gap touches); the pointer engine sets it from the preview,
  // direct calls keep the baseline, non-image units ignore it.
  var evidence = window.__evidence || (window.__evidence = {});
  evidence.moveElement = moveElement;
  evidence.alignProps = alignProps;
  evidence.alignEvidenceColumns = alignEvidenceColumns;
  evidence.renumber = renumber;
  // 0111 (SPEC §21 test seam): the TOC gap mapper — a flat entry-list gap
  // index (0..n over the depth-first section list) + the dragged section
  // → the document gap { container, before } or null (the cycle rule). The
  // pointer math itself stays out of jsdom's reach (0025 precedent);
  // moveElement performs the mapped move.
  evidence.tocDropTarget = tocDropTarget;
  // 0082: the browser verification seam exercises the same chrome-stripping
  // serializer used by Save without requiring a native file picker.
  evidence.serialize = serialize;
  // 0042 (§20 test seam): the used-image-names set, so the re-seed
  // bookkeeping after an apply is observable (the boot rule is DOM-only
  // otherwise; the set drives fallback name-collision checks, §6.4).
  evidence.usedNames = usedNames;
  // 0036 (§18 test seam): the single injectable measurement function. A
  // test-provided measurer (set before or after load) is kept; otherwise
  // the canvas default measures the unwrapped key in its own font.
  if (typeof evidence.measureKeyWidth !== 'function') evidence.measureKeyWidth = defaultMeasureKeyWidth;
  if (typeof evidence.measureSectionNumberWidth !== 'function') {
    evidence.measureSectionNumberWidth = defaultMeasureTextWidth;
  }

  if (window.__evidenceBooted) {
    refreshChrome(); // chrome re-rendered; handlers were bound once already
    return;
  }
  window.__evidenceBooted = true;
  initializeThemeAppearance();
  bindHandlers();
  boot();
})();
</script>
</body>
</html>
