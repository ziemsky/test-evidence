  var SCREENSHOT_ACTIONS = [
    { action: 'size-small', label: 'small' },
    { action: 'size-medium', label: 'medium' },
    { action: 'size-large', label: 'large' },
    { action: 'size-page-width', label: 'page-width' },
    { action: 'size-original', label: 'original' },
    { action: 'size-larger', label: 'larger' },
    { action: 'size-smaller', label: 'smaller' },
    // 0051 (SPEC §23): stateful standalone toggle — after the size controls,
    // before Copy/Delete; the marker rides on the shot (data-standalone)
    { action: 'standalone', label: 'standalone' },
    { action: 'open-image', label: 'open image' },
    { action: 'copy', label: 'copy' },
    { action: 'delete', label: 'delete' },
  ];
  function sectionActions() {
    var actions = SECTION_ACTIONS.slice();
    // A system clipboard may have been populated by another document, so
    // these targets cannot depend on the page-local clipboard cache.
    actions.splice.apply(actions, [actions.length - 1, 0].concat([
      { action: 'paste-after', label: 'paste after' },
      { action: 'paste-here', label: 'paste here' },
    ]));
    return actions;
  }

  function fileActions() {
    var actions = FILE_ACTIONS.slice();
    actions.splice(actions.length - 1, 0, { action: 'paste-after', label: 'paste after' });
    return actions;
  }

  function itemActions(isCode) {
    var actions = (isCode ? CODE_ACTIONS : ITEM_ACTIONS).slice();
    actions.splice(actions.length - 1, 0, { action: 'paste-after', label: 'paste after' });
    return actions;
  }

  // 0107 (SPEC §29): the six in-section content adds, with the section
  // toolbox's established labels. Subsection and section-after adds stay
  // section-level only.
  var ROW_CONTENT_ADDS = [
    { action: 'add-comment', label: '+ comment' },
    { action: 'add-code', label: '+ code' },
    { action: 'add-property', label: '+ property' },
    { action: 'add-screenshot', label: '+ screenshot' },
    { action: 'add-file', label: '+ file' },
    { action: 'add-url', label: '+ url' },
  ];

  // 0107–0109 (SPEC §29): authored content rows carry the six in-section
  // adds above their existing tools in their current order.
  function rowContentActions(existingActions) {
    return ROW_CONTENT_ADDS.concat(existingActions);
  }

  function contentRowActionsFor(target) {
    if (target && target.matches('.ev-code')) return rowContentActions(itemActions(true));
    if (target && target.matches('.ev-url')) return rowContentActions(urlActions());
    if (target && target.matches('.ev-file')) return rowContentActions(fileActions());
    if (target && target.matches('.ev-property, .ev-comment')) return rowContentActions(itemActions(false));
    return null;
  }

  function urlActions() {
    return URL_ACTIONS.slice();
  }

  // 0066 (SPEC §27): the rename button is only for screenshots that display
  // a name — an assets/ src. Data-URL screenshots (no name, no §26 label)
  // get no button. The palette therefore tracks the shot's src.
  function screenshotActions(hasAssetName) {
    var actions = SCREENSHOT_ACTIONS.slice();
    if (hasAssetName) {
      var copyIndex = actions.length - 2; // 'copy' sits second to last
      for (var i = 0; i < actions.length; i++) {
        if (actions[i].action === 'copy') { copyIndex = i; break; }
      }
      actions.splice(copyIndex, 0, { action: 'rename-file', label: 'rename file' });
    }
    actions.splice(actions.length - 1, 0, { action: 'paste-after', label: 'paste after' });
    return actions;
  }

  // Reconcile the shot's palette with its src: rebuilt only when the
  // rename button's presence would change (creation, paste, rename, boot).
  function refreshScreenshotActions(item) {
    var image = item.querySelector(':scope > img.ev-img');
    var src = image ? (image.getAttribute('src') || '') : '';
    var actions = screenshotActions(src.indexOf('assets/') === 0);
    var expected = actions.map(function (a) { return a.action; }).join(',');
    var controls = item.querySelector(':scope > .ev-controls');
    var actual = controls
      ? [...controls.children].map(function (b) { return b.dataset.action; }).join(',')
      : '';
    if (actual === expected) return;
    if (controls) controls.remove();
    item.appendChild(chromeControls(actions));
  }

  function makeSection(titleText) {
    var section = element('section', 'ev-section');
    var h2 = element('h2', 'ev-title');
    h2.appendChild(makeDragHandle()); // 0027: the handle precedes the number (SPEC §3)
    var num = element('span', 'ev-num');
    num.setAttribute('data-chrome', '');
    var title = element('span', 'ev-text ev-title-text', titleText != null ? titleText : '');
    title.setAttribute('contenteditable', 'true');
    h2.appendChild(num);
    h2.appendChild(title);
    section.appendChild(h2);
    section.appendChild(element('div', 'ev-body'));
    return section;
  }

  function makeComment(text) {
    var div = element('div', 'ev-comment');
    div.appendChild(makeDragHandle());
    var textSpan = element('span', 'ev-text ev-comment-text', text != null ? text : '');
    textSpan.setAttribute('contenteditable', 'true');
    div.appendChild(textSpan);
    div.appendChild(chromeControls(rowContentActions(itemActions(false))));
    div.appendChild(makeCopyOverlay());
    updatePrintVisibility(div);
    return div;
  }

  function makeCode(text) {
    var div = element('div', 'ev-code');
    div.appendChild(makeDragHandle());
    var textSpan = element('span', 'ev-text ev-code-text', text != null ? text : '');
    textSpan.setAttribute('contenteditable', 'true');
    div.appendChild(textSpan);
    var controls = chromeControls(rowContentActions(itemActions(true)));
    controls.querySelector('[data-action="soft-wrap"]').setAttribute('aria-pressed', 'false');
    div.appendChild(controls);
    div.appendChild(makeCopyOverlay());
    updatePrintVisibility(div);
    return div;
  }

  function makeProperty(keyText, valueText) {
    var div = element('div', 'ev-property');
    div.appendChild(makeDragHandle());
    var key = element('span', 'ev-text ev-prop-key', keyText != null ? keyText : '');
    key.setAttribute('contenteditable', 'true');
    var sep = element('span', 'ev-sep', ':');
    var value = element('span', 'ev-text ev-prop-value', valueText != null ? valueText : '');
    value.setAttribute('contenteditable', 'true');
    div.appendChild(key);
    div.appendChild(sep);
    div.appendChild(value);
    // 0107–0109 (SPEC §29): legacy row chrome mirrors the shared toolbox.
    div.appendChild(chromeControls(rowContentActions(itemActions(false))));
    div.appendChild(makeCopyOverlay());
    updatePrintVisibility(div);
    return div;
  }

  function makeFile(filename) {
    var div = element('div', 'ev-file');
    div.appendChild(makeDragHandle());
    var link = element('a', null, filename);
    link.setAttribute('href', 'assets/' + encodeURIComponent(filename));
    link.setAttribute('target', '_blank');
    link.setAttribute('rel', 'noopener');
    div.appendChild(link);
    // 0109 (SPEC §29): legacy row chrome mirrors the shared file toolbox.
    div.appendChild(chromeControls(rowContentActions(fileActions())));
    return div;
  }

  function normalizeUrlHref(value) {
    var url = String(value || '').trim();
    if (!url || /^[a-z][a-z\d+.-]*:/i.test(url)) return url;
    return 'https://' + url;
  }

  var urlEditOriginals = new WeakMap();

  function makeUrlDisplay(url, text) {
    if (url) {
      var link = element('a', 'ev-url-link', text || url);
      link.setAttribute('href', url);
      link.setAttribute('target', '_blank');
      link.setAttribute('rel', 'noopener');
      return link;
    }
    return element('span', 'ev-url-empty', 'URL...');
  }

  function renderUrlDisplay(row, url, text) {
    row.querySelectorAll(':scope > .ev-url-link, :scope > .ev-url-empty')
      .forEach(function (display) { display.remove(); });
    var editor = row.querySelector(':scope > .ev-url-editor');
    row.setAttribute('data-text', text || '');
    row.insertBefore(makeUrlDisplay(url, text), editor || null);
    updatePrintVisibility(row);
  }

  function urlEditorFor(target) {
    if (!target || !target.closest) return null;
    var editor = target.closest('.ev-url-editor');
    return editor && editor.closest('#evidence .ev-url') ? editor : null;
  }

  function urlEditorInputs(row) {
    return {
      url: row.querySelector(':scope > .ev-url-editor > .ev-url-input'),
      text: row.querySelector(':scope > .ev-url-editor > .ev-text-input'),
    };
  }

  function updateUrlDisplayFromInputs(row) {
    var inputs = urlEditorInputs(row);
    if (!inputs.url || !inputs.text) return;
    renderUrlDisplay(row, normalizeUrlHref(inputs.url.value), inputs.text.value.trim());
  }

  function finishUrlEditing(row) {
    if (!row || !row.hasAttribute('data-editing')) return;
    var inputs = urlEditorInputs(row);
    if (inputs.url && inputs.text) {
      inputs.url.value = inputs.url.value.trim();
      inputs.text.value = inputs.text.value.trim();
      renderUrlDisplay(row, normalizeUrlHref(inputs.url.value), inputs.text.value);
    }
    row.removeAttribute('data-editing');
    urlEditOriginals.delete(row);
  }

  function startUrlEditing(row) {
    var link = row.querySelector(':scope > .ev-url-link');
    var inputs = urlEditorInputs(row);
    if (!inputs.url || !inputs.text) return;
    var url = link ? link.getAttribute('href') || '' : '';
    var text = row.getAttribute('data-text') || '';
    urlEditOriginals.set(row, { url: url, text: text });
    inputs.url.value = url;
    inputs.text.value = text;
    row.setAttribute('data-editing', '');
    focusTextFieldAtEnd(inputs.url);
  }

  function prepareUrlRowsForPrint() {
    document.querySelectorAll('#evidence .ev-url[data-editing]').forEach(finishUrlEditing);
    refreshPrintVisibility();
  }

  function cancelUrlEditing(row) {
    if (!row || !row.hasAttribute('data-editing')) return;
    var original = urlEditOriginals.get(row);
    if (original) {
      var originalInputs = urlEditorInputs(row);
      if (originalInputs.url) originalInputs.url.value = original.url;
      if (originalInputs.text) originalInputs.text.value = original.text;
      renderUrlDisplay(row, original.url, original.text);
      row.removeAttribute('data-editing');
      urlEditOriginals.delete(row);
      return;
    }
    var inputs = urlEditorInputs(row);
    if (inputs.url) inputs.url.value = '';
    if (inputs.text) inputs.text.value = '';
    renderUrlDisplay(row, '', '');
    row.removeAttribute('data-editing');
  }

  function makeUrlRow() {
    var row = element('div', 'ev-url');
    row.setAttribute('data-text', '');
    row.appendChild(makeDragHandle());
    row.appendChild(makeUrlDisplay('', ''));
    var editor = element('div', 'ev-url-editor');
    editor.setAttribute('data-chrome', '');
    var urlInput = element('input', 'ev-url-input');
    urlInput.type = 'text';
    urlInput.placeholder = 'URL...';
    var textInput = element('input', 'ev-text-input');
    textInput.type = 'text';
    textInput.placeholder = 'Text...';
    editor.appendChild(urlInput);
    editor.appendChild(textInput);
    row.appendChild(editor);
    // 0109 (SPEC §29): legacy row chrome mirrors the shared URL toolbox.
    row.appendChild(chromeControls(rowContentActions(urlActions())));
    row.setAttribute('data-editing', '');
    updatePrintVisibility(row);
    return row;
  }

  function ensureUrlRowChrome(row) {
    if (!row.querySelector(':scope > .ev-drag-handle')) {
      row.insertBefore(makeDragHandle(), row.firstChild);
    }
    if (!row.querySelector(':scope > .ev-url-link, :scope > .ev-url-empty')) {
      var anchor = row.querySelector(':scope > a');
      if (anchor) anchor.classList.add('ev-url-link');
      else row.appendChild(makeUrlDisplay('', ''));
    }
    if (!row.hasAttribute('data-text')) {
      var link = row.querySelector(':scope > .ev-url-link');
      var href = link ? (link.getAttribute('href') || '') : '';
      var label = link ? link.textContent : '';
      row.setAttribute('data-text', label === href ? '' : label);
    }
    updatePrintVisibility(row);
  }

  // 0046 (SPEC §22): image and caption are screenshot content. This helper
  // is used only by creation flows, so boot never back-fills older rows.
  function makeScreenshot(captionText, initialSize) {
    var item = element('div', 'ev-screenshot');
    if (initialSize) item.dataset.size = initialSize;
    item.appendChild(makeDragHandle());
    var img = element('img', 'ev-img');
    img.addEventListener('load', onScreenshotImageLoad);
    img.alt = captionText != null ? captionText : '';
    item.appendChild(img);
    var caption = element('span', 'ev-text ev-caption', captionText != null ? captionText : '');
    caption.setAttribute('contenteditable', 'true');
    item.appendChild(caption);
    item.appendChild(chromeControls(SCREENSHOT_ACTIONS));
    return item;
  }

  // 0051 (SPEC §3, §23): the screenshot row wrapper — content, not chrome.
  // One per maximal run of consecutive screenshots in a .ev-body; alignment
  // state rides on the wrapper (data-valign / data-halign, omitted at the
  // top/center defaults). Rows are created, split, and discarded only by the
  // §23 mutation mechanics — never managed manually.
  function makeShotRow() {
    return element('div', 'ev-shot-row');
  }

  // 0051/0090 (SPEC §3, §11, §23): the row's control strip — chrome (rebuilt
  // at boot, stripped on save), always the wrapper's second child after the
  // row drag handle, right-aligned above the first image. `top mid bot · left center right` — stateful
  // toggles: the active choice (top/center when the wrapper omits the
  // attribute) is highlighted.
  var ROW_CONTROL_DEFS = [
    ['row-valign-top', 'top', 'valign', 'top'],
    ['row-valign-middle', 'mid', 'valign', 'middle'],
    ['row-valign-bottom', 'bot', 'valign', 'bottom'],
    ['row-halign-left', 'left', 'halign', 'left'],
    ['row-halign-center', 'center', 'halign', 'center'],
    ['row-halign-right', 'right', 'halign', 'right'],
  ];

  function screenshotRowActions() {
    var existingActions = ROW_CONTROL_DEFS.map(function (def) {
      return { action: def[0], label: def[1] };
    });
    return rowContentActions(existingActions);
  }

  function rowControlState(row) {
    return {
      valign: row.getAttribute('data-valign') || 'top',
      halign: row.getAttribute('data-halign') || 'center',
    };
  }

  function makeRowControls(row) {
    var strip = element('div', 'ev-row-controls');
    strip.setAttribute('data-chrome', '');
    var current = rowControlState(row);
    ROW_CONTROL_DEFS.forEach(function (def, i) {
      if (i === 3) strip.appendChild(element('span', 'ev-row-sep', '·'));
      var b = chromeButton(def[0], def[1]);
      if (current[def[2]] === def[3]) b.setAttribute('data-active', 'true');
      strip.appendChild(b);
    });
    return strip;
  }

  function ensureShotRowChrome(row) {
    var handle = row.querySelector(':scope > .ev-drag-handle');
    if (!handle) handle = makeDragHandle();
    handle.setAttribute('data-chrome', '');
    if (row.firstElementChild !== handle) row.insertBefore(handle, row.firstChild);

    var controls = row.querySelector(':scope > .ev-row-controls');
    if (!controls) controls = makeRowControls(row);
    controls.setAttribute('data-chrome', '');
    if (handle.nextElementSibling !== controls) row.insertBefore(controls, handle.nextElementSibling);
  }

  function makeScreenshotPending() {
    var div = element('div', 'ev-screenshot-pending');
    div.setAttribute('data-chrome', '');
    div.appendChild(element('span', null, 'Press ' + pasteShortcutLabel() + ' to paste from clipboard'));
    return div;
  }

  function pasteShortcutLabel() {
    var platform = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || '';
    return /^mac/i.test(platform) ? '⌘+V' : 'Ctrl+V';
  }

  function makePasteTargetPending() {
    var div = element('div', 'ev-paste-target-pending');
    div.setAttribute('data-chrome', '');
    div.setAttribute('role', 'status');
    div.setAttribute('aria-live', 'polite');
    div.appendChild(element('span', null, 'Press ' + pasteShortcutLabel() + ' to paste from clipboard'));
    return div;
  }

  // Help is browser chrome, re-created at boot and removed from saved
  // evidence. Topic and divider state live on this panel for the page
  // session, so closing Help never resets the user's place.
  function renderHelpPanel() {
    var old = document.getElementById('help-panel');
    if (old) old.remove();
    var panel = element('aside', null);
    panel.id = 'help-panel';
    panel.setAttribute('data-chrome', '');
    panel.setAttribute('aria-label', 'Help');
    panel.setAttribute('aria-labelledby', 'help-heading');
    panel.setAttribute('aria-hidden', String(!document.body.classList.contains('help-open')));

    var header = element('header', 'help-header');
    var heading = element('h2', 'help-heading', 'Help');
    heading.id = 'help-heading';
    header.appendChild(heading);
    panel.appendChild(header);
    panel.appendChild(makePanelResizeHandle('help', panel));

    var workspace = element('div', 'help-workspace');
    var toc = element('nav', 'help-toc');
    toc.setAttribute('aria-label', 'Help topics');
    var tocList = element('ul', 'help-toc-list');
    toc.appendChild(tocList);
    var divider = element('div', 'help-divider');
    divider.setAttribute('role', 'separator');
    divider.setAttribute('aria-label', 'Resize Help topic panes');
    divider.setAttribute('aria-orientation', 'horizontal');
    divider.setAttribute('aria-valuemin', '12');
    divider.setAttribute('aria-valuemax', '50');
    divider.setAttribute('aria-valuenow', '20');
    divider.setAttribute('aria-valuetext', '20% topics, 80% content');
    divider.setAttribute('aria-controls', 'help-topic-content');
    divider.setAttribute('tabindex', '-1');
    divider.hidden = true;
    var topicContent = element('div', 'help-topic-content');
    topicContent.id = 'help-topic-content';
    workspace.appendChild(toc);
    workspace.appendChild(divider);
    workspace.appendChild(topicContent);

    var tocHeight = 20;
    var topics = [
      {
        id: 'first-save',
        title: 'First save for each session copy',
        build: function (topic) {
          topic.appendChild(element(
            'p',
            null,
            'Direct saving requires a Chromium-based browser such as Chrome or Edge. In browsers without the File System Access API, “Save” is unavailable.',
          ));
          topic.appendChild(element(
            'p',
            null,
            'Click “Save” or press Ctrl/Cmd+S. The first save asks you to choose a folder. Select the folder containing the open HTML file, not a filename; the app writes this copy under its current filename.',
          ));
          topic.appendChild(element(
            'p',
            null,
            'Later saves use that folder. After you close and reopen tabs for this file, Chrome or Edge may ask for permission again.',
          ));
          topic.appendChild(element('h4', null, 'If you cancel the folder picker'));
          topic.appendChild(element(
            'p',
            null,
            '“Save” switches to whole-file downloads for the rest of this page session. Reload the original file in Chrome or Edge to choose a folder again.',
          ));
        },
      },
      {
        id: 'copy',
        title: 'Copy between open document instances',
        build: function (topic) {
          topic.appendChild(element(
            'p',
            null,
            'To copy authored content between separate tabs or windows, use the system clipboard:',
          ));
          var steps = element('ol', null);
          steps.appendChild(element(
            'li',
            null,
            'In the source document, choose the “copy element” button on the row or section.',
          ));
          steps.appendChild(element(
            'li',
            null,
            'In the destination document, choose “paste after” beside a row, or “paste here” from a section’s controls to add the content inside that section. A placeholder will show where the copied content will be inserted.',
          ));
          steps.appendChild(element(
            'li',
            null,
            'Press Ctrl/Cmd+V, or use the browser’s Paste command. The copied content will be pasted at the placeholder.',
          ));
          topic.appendChild(steps);
        },
      },
      {
        id: 'move-sections',
        title: 'Move sections and subsections',
        build: function (topic) {
          topic.appendChild(element(
            'p',
            null,
            'The easiest way to move a section or subsection is to drag its entry in the Content menu on the left.',
          ));
          topic.appendChild(element(
            'p',
            null,
            'This is often clearer than dragging the heading in the document, especially in a long document.',
          ));
          topic.appendChild(element(
            'p',
            null,
            'Drop above or below another entry to place it before or after that section.',
          ));
          topic.appendChild(element(
            'p',
            null,
            'Drop in the right side of an entry to make it a subsection.',
          ));
          topic.appendChild(element(
            'p',
            null,
            'Numbering updates automatically; click Save to keep the change.',
          ));
        },
      },
    ];

    function setTocHeight(value) {
      tocHeight = Math.min(50, Math.max(12, Math.round(value)));
      workspace.style.setProperty('--help-toc-height', tocHeight + '%');
      divider.setAttribute('aria-valuenow', String(tocHeight));
      divider.setAttribute('aria-valuetext', tocHeight + '% topics, ' + (100 - tocHeight) + '% content');
    }

    function selectTopic(topic) {
      if (!workspace.classList.contains('help-split')) {
        setTocHeight(20);
        workspace.classList.add('help-split');
        divider.hidden = false;
        divider.setAttribute('tabindex', '0');
      }
      topics.forEach(function (entry) {
        var entryLink = tocList.querySelector('[data-help-topic="' + entry.id + '"]');
        var entryArticle = topicContent.querySelector('[data-topic="' + entry.id + '"]');
        if (entryLink) {
          if (entry.id === topic.id) entryLink.setAttribute('aria-current', 'page');
          else entryLink.removeAttribute('aria-current');
        }
        if (entryArticle) entryArticle.hidden = entry.id !== topic.id;
      });
      workspace.dataset.selectedTopic = topic.id;
      topicContent.scrollTop = 0;
    }

    topics.forEach(function (topic) {
      var item = element('li', null);
      var link = element('button', 'help-topic-link', topic.title);
      link.type = 'button';
      link.dataset.helpTopic = topic.id;
      link.setAttribute('aria-controls', 'help-topic-' + topic.id);
      link.addEventListener('click', function () { selectTopic(topic); });
      item.appendChild(link);
      tocList.appendChild(item);

      var article = element('article', 'help-topic');
      article.id = 'help-topic-' + topic.id;
      article.dataset.topic = topic.id;
      article.hidden = true;
      article.appendChild(element('h3', null, topic.title));
      topic.build(article);
      topicContent.appendChild(article);
    });

    divider.addEventListener('keydown', function (event) {
      var next;
      if (event.key === 'ArrowUp') next = tocHeight - 1;
      else if (event.key === 'ArrowDown') next = tocHeight + 1;
      else if (event.key === 'PageUp') next = tocHeight - 5;
      else if (event.key === 'PageDown') next = tocHeight + 5;
      else if (event.key === 'Home') next = 12;
      else if (event.key === 'End') next = 50;
      else return;
      event.preventDefault();
      setTocHeight(next);
    });

    var pointerDrag = null;
    divider.addEventListener('pointerdown', function (event) {
      if (event.button !== undefined && event.button !== 0) return;
      var bounds = workspace.getBoundingClientRect();
      if (!bounds.height) return;
      event.preventDefault();
      pointerDrag = {
        startY: event.clientY,
        startHeight: tocHeight,
        panelHeight: bounds.height,
      };
      if (typeof divider.setPointerCapture === 'function' && event.pointerId !== undefined) {
        try { divider.setPointerCapture(event.pointerId); } catch (_) {}
      }
    });
    window.addEventListener('pointermove', function (event) {
      if (!pointerDrag) return;
      setTocHeight(pointerDrag.startHeight + (event.clientY - pointerDrag.startY) * 100 / pointerDrag.panelHeight);
    });
    function stopPointerDrag() { pointerDrag = null; }
    window.addEventListener('pointerup', stopPointerDrag);
    window.addEventListener('pointercancel', stopPointerDrag);

    panel.appendChild(workspace);
    var footer = element('footer', 'help-footer', 'version: 2026-11-03');
    footer.setAttribute('aria-label', 'Version');
    panel.appendChild(footer);
    document.body.appendChild(panel);
  }

  // ---------------------------------------------------------------------
  // Numbering (SPEC §7): pure function of tree position
  // ---------------------------------------------------------------------

  // 0044 (SPEC §21): the TOC panel and its tree — chrome, re-created on
  // every render. The expanded/collapsed state lives on the body class, so
  // re-creating the panel never resets it. One <button data-action=
  // "toc-goto"> per .ev-section at any depth, in document order (depth-
  // first, top to bottom); the unnumbered document title is never listed.
  // The entry resolves its section by index at click time (data-target is
  // the index into the live section list, recomputed per render).
  function renderToc() {
    var old = document.getElementById('toc-panel');
    if (old) old.remove();
    var collapsed = document.body.classList.contains('toc-collapsed');
    var nav = element('nav', null, null);
    nav.id = 'toc-panel';
    nav.setAttribute('data-chrome', '');
    var header = element('div', 'toc-header');
    header.appendChild(element('span', 'toc-caption', 'Content'));
    var toggle = element('button', null, '☰');
    toggle.id = 'toc-toggle';
    toggle.setAttribute('data-action', 'toggle-toc');
    toggle.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
    toggle.setAttribute('aria-controls', 'toc-tree');
    header.appendChild(toggle);
    var tree = element('div', null);
    tree.id = 'toc-tree';
    var sections = [...document.querySelectorAll('#evidence .ev-section')];
    if (sections.length === 0) {
      // the persistent end-of-document toolbox stays the way to add the first one (§11)
      tree.appendChild(element('div', 'toc-hint', 'No sections yet'));
    } else {
      sections.forEach(function (section, i) {
        var h2 = section.querySelector(':scope > h2.ev-title');
        var num = h2 ? h2.querySelector(':scope > .ev-num') : null;
        var titleEl = h2 ? h2.querySelector(':scope > .ev-title-text') : null;
        var numText = num ? num.textContent : '';
        var title = titleEl ? titleEl.textContent.trim() : '';
        var entry;
        if (title) {
          var label = numText + ' ' + title;
          entry = element('button', 'toc-entry', label);
          entry.setAttribute('title', label);
        } else {
          // an empty title renders the muted "Untitled" (mirrors the
          // document's own :empty::before placeholder — the number stands)
          entry = element('button', 'toc-entry', null);
          if (numText) entry.appendChild(document.createTextNode(numText + ' '));
          entry.appendChild(element('span', 'toc-untitled', 'Untitled'));
          entry.setAttribute('title', numText ? numText + ' Untitled' : 'Untitled');
        }
        entry.setAttribute('data-action', 'toc-goto');
        // depth 1 = top level; padding-left = (depth − 1) × 1em (SPEC §21)
        var depth = 1;
        for (var p = section.parentElement; p; p = p.parentElement) {
          if (p.classList && p.classList.contains('ev-section')) depth++;
        }
        entry.style.paddingLeft = (depth - 1) + 'em';
        entry.dataset.target = String(i);
        tree.appendChild(entry);
      });
    }
    nav.appendChild(header);
    nav.appendChild(tree);
    nav.appendChild(makePanelResizeHandle('toc', nav));
    document.body.insertBefore(nav, document.body.firstChild);
  }

  function renumber() {
    (function walk(sections, prefix) {
      sections.forEach(function (section, i) {
        var num = prefix ? prefix + '.' + (i + 1) : String(i + 1);
        // 0032: the depth stamp (SPEC §7/§16) comes from this same walk, so
        // the size can never disagree with the number. Capped at 3: the floor
        // size covers depth 3 and beyond. Chrome — stripped on save (§5.3.4).
        var depth = prefix ? prefix.split('.').length : 0;
        section.setAttribute('data-depth', String(Math.min(depth, 3)));
        var h2 = section.querySelector(':scope > h2.ev-title');
        if (h2) {
          var span = h2.querySelector(':scope > .ev-num');
          if (span) span.textContent = num;
        }
        var body = section.querySelector(':scope > .ev-body');
        if (body) {
          walk([...body.querySelectorAll(':scope > .ev-section')], num);
        }
      });
    })([...document.querySelectorAll('#evidence > .ev-section')], '');
    // 0044 (§21): the TOC re-renders after every renumber — a TOC that
    // disagrees with the document's numbers is a bug. The open/closed state
    // rides on the body class, so this re-creation never resets it.
    renderToc();
    alignEvidenceColumns();
    updateSectionPaletteHeader(paletteOwnerTarget());
  }

  // 0069: one canvas text-measurement path serves the section-number and
  // property-key layout columns. The browser path is intentionally shared so
  // both columns use the same font-style/font-weight/font-size/font-family
  // assembly and the same headless fallback behavior.
  function defaultMeasureTextWidth(textEl) {
    var text = textEl.textContent;
    if (!text) return 0;
    var ctx = document.createElement('canvas').getContext('2d');
    if (!ctx || typeof ctx.measureText !== 'function') return 0;
    var s = window.getComputedStyle(textEl);
    ctx.font = s.fontStyle + ' ' + s.fontWeight + ' ' + s.fontSize + ' ' + s.fontFamily;
    return ctx.measureText(text).width;
  }

  function alignEvidenceColumns() {
    var root = document.getElementById('evidence');
    if (!root) return;
    var rootFontSize = parseFloat(window.getComputedStyle(root).fontSize) || 16;
    var gutter = rootFontSize * 0.85;
    var gap = rootFontSize * 0.75;
    var max = 0;
    var measurer = window.__evidence && window.__evidence.measureSectionNumberWidth;
    if (typeof measurer !== 'function') measurer = defaultMeasureTextWidth;
    root.querySelectorAll('.ev-num').forEach(function (number) {
      var width = Number(measurer(number)) || 0;
      if (width > max) max = width;
    });
    max = Math.ceil(max);
    var contentStart = gutter + max + gap;
    root.style.setProperty('--ev-gutter-width', gutter + 'px');
    root.style.setProperty('--ev-number-width', max + 'px');
    root.style.setProperty('--ev-number-gap', gap + 'px');
    root.style.setProperty('--ev-content-start', contentStart + 'px');
  }

  // ---------------------------------------------------------------------
  // 0036: property key alignment (SPEC §18). Measure-and-pad, per .ev-body:
  // measure the direct property keys' unwrapped (max-content) widths,
  // take the clamped max, stamp each row. The group is the section's own
  // direct property rows — a subsection's properties form their own group;
  // comment and screenshot rows neither participate nor break the group.
  // ---------------------------------------------------------------------

  // The default measurement (the browser path). A rendered (already-wrapped)
  // key reports the container width, not its text width, so the measurement
  // is of the full unwrapped text, in the key's own computed font.
  function defaultMeasureKeyWidth(keyEl) {
    // Empty keys count as width 0; the "Key" hint is CSS-only. A headless
    // environment without a usable 2D context also returns 0; tests inject a
    // deterministic fake through the established seam.
    return defaultMeasureTextWidth(keyEl);
  }

  function alignProps() {
    document.querySelectorAll('#evidence .ev-body').forEach(function (body) {
      var rows = [...body.querySelectorAll(':scope > .ev-property')];
      if (rows.length === 0) return;
      var max = 0;
      rows.forEach(function (row) {
        var key = row.querySelector(':scope > .ev-prop-key');
        if (!key) return;
        // The single seam where pixels enter the logic (SPEC §18): tests
        // replace window.__evidence.measureKeyWidth with a deterministic fake.
        var w = window.__evidence.measureKeyWidth(key);
        if (w > max) max = w;
      });
      // The clamp: the .ev-body content width minus the shared authored
      // content line. When it bites, the over-long key fills the row and
      // wraps inside its box (its colon drops a line) while the group's other
      // keys still pad to the clamped column, so the colons stay on one
      // vertical line.
      var evidenceRoot = document.getElementById('evidence');
      var contentStart = parseFloat(
        evidenceRoot && evidenceRoot.style.getPropertyValue('--ev-content-start'),
      );
      if (!Number.isFinite(contentStart)) {
        contentStart = parseFloat(window.getComputedStyle(rows[0]).paddingLeft) || 0;
      }
      var cap = Math.max(0, body.clientWidth - contentStart);
      var width = Math.round(Math.min(max, cap));
      // 0038 (§18 amended): when the key column consumes the row (the clamp
      // bites, or a natural key leaves no positive rest after the 1em
      // separator), the value's rest-of-line cap is <= 0 — stamp the
      // clamped-column marker so the CSS drops the separator and value to
      // the second flex line with a non-zero box. Chrome like data-key-w:
      // stripped on save and boot, re-stamped by every pass.
      var em = parseFloat(window.getComputedStyle(rows[0]).fontSize) || 16;
      var clamped = width + em >= cap;
      rows.forEach(function (row) {
        row.setAttribute('data-key-w', String(width));
        row.style.setProperty('--key-w', width + 'px');
        if (clamped) row.setAttribute('data-key-clamped', '');
        else row.removeAttribute('data-key-clamped');
      });
    });
    updatePropertyValueAlignment();
  }

  // Keep single-line labels centered with their values, but pin labels for a
  // value whose rendered box contains multiple lines to the first line.
  // The marker is live layout chrome and is stripped before save or boot.
  function updatePropertyValueAlignment() {
    document.querySelectorAll('#evidence .ev-property').forEach(function (row) {
      var value = row.querySelector(':scope > .ev-prop-value');
      if (!value) return;
      var style = window.getComputedStyle(value);
      var lineHeight = parseFloat(style.lineHeight);
      if (!Number.isFinite(lineHeight)) {
        lineHeight = (parseFloat(style.fontSize) || 16) * 1.5;
      }
      var height = value.getBoundingClientRect().height;
      var multiline = height > lineHeight + 0.5;
      row.toggleAttribute('data-value-multiline', multiline);
    });
  }

  // ---------------------------------------------------------------------
  // Chrome refresh (SPEC §4.3, §11): adopt content as-is, render chrome
  // ---------------------------------------------------------------------

  function ensureControls(owner, actions, isSectionPalette) {
    var controls = owner.querySelector(':scope > .ev-controls');
    var expected = actions.map(function (a) { return a.action; }).join(',');
    var actual = controls
      ? [...controls.children].map(function (button) { return button.dataset.action; }).join(',')
      : '';
    var iconsPresent = !isSectionPalette || (controls &&
      [...controls.children].every(function (button) {
        return button.querySelector(':scope > .ev-action-icon');
      }));
    var paletteMarkerPresent = !isSectionPalette ||
      (controls && controls.hasAttribute('data-section-palette'));
    if (actual !== expected || !iconsPresent || !paletteMarkerPresent) {
      var replacement = chromeControls(actions, isSectionPalette);
      if (controls) controls.replaceWith(replacement);
      else owner.appendChild(replacement);
    }
  }

  // 0086: section actions live in one reusable transient panel. The panel is
  // deliberately outside any section so changing the active section can
  // animate its position instead of replacing one fixed panel with another.
  function paletteActionsForTarget(target) {
    if (target && target.matches('.ev-screenshot')) {
      var image = target.querySelector(':scope > img.ev-img');
      var src = image ? (image.getAttribute('src') || '') : '';
      return [{ action: 'add-screenshot', label: '+ screenshot' }]
        .concat(screenshotActions(src.indexOf('assets/') === 0));
    }
    if (target && target.matches('.ev-shot-row')) return screenshotRowActions();
    return contentRowActionsFor(target) || sectionActions();
  }

  function replacePaletteActions(palette, actions) {
    palette.querySelectorAll(':scope > button, :scope > .ev-palette-separator')
      .forEach(function (node) { node.remove(); });
    appendPaletteActions(palette, actions, true);
  }

  function refreshSharedPaletteState(target, palette) {
    if (!target || !palette) return;
    var softWrap = palette.querySelector(':scope > button[data-action="soft-wrap"]');
    if (softWrap) {
      var active = target.hasAttribute('data-soft-wrap');
      softWrap.setAttribute('aria-pressed', active ? 'true' : 'false');
      if (active) softWrap.setAttribute('data-active', 'true');
      else softWrap.removeAttribute('data-active');
    }
    if (target.matches('.ev-screenshot')) {
      var size = target.getAttribute('data-size') || 'original';
      palette.querySelectorAll(':scope > button[data-action^="size-"]')
        .forEach(function (button) {
          var isPreset = ['small', 'medium', 'large', 'page-width', 'original']
            .includes(button.dataset.action.slice('size-'.length));
          var selected = isPreset && button.dataset.action === 'size-' + size;
          button.toggleAttribute('data-active', selected);
          if (isPreset) button.setAttribute('aria-pressed', selected ? 'true' : 'false');
        });
      var sourceControls = target.querySelector(':scope > .ev-controls');
      ['size-larger', 'size-smaller'].forEach(function (action) {
        var source = sourceControls && sourceControls.querySelector('[data-action="' + action + '"]');
        var button = palette.querySelector(':scope > button[data-action="' + action + '"]');
        if (button) button.disabled = !!(source && source.disabled);
      });
      var standalone = palette.querySelector(':scope > button[data-action="standalone"]');
      if (standalone) {
        standalone.toggleAttribute('data-active', target.hasAttribute('data-standalone'));
        standalone.setAttribute('aria-pressed', target.hasAttribute('data-standalone') ? 'true' : 'false');
      }
    }
    if (target.matches('.ev-shot-row')) {
      var state = rowControlState(target);
      palette.querySelectorAll(':scope > button[data-action^="row-"]')
        .forEach(function (button) {
          var match = button.dataset.action.match(/^row-(valign|halign)-(.+)$/);
          button.toggleAttribute('data-active', !!match && state[match[1]] === match[2]);
        });
    }
    refreshFileSystemDependentButtons();
  }

  function ensureSharedSectionPalette() {
    var root = document.getElementById('evidence');
    if (!root) return null;
    var palette = root.querySelector(':scope > .ev-section-palette[data-section-palette]');
    var actions = paletteActionsForTarget(paletteOwnerTarget());
    var expected = actions.map(function (a) { return a.action; }).join(',');
    var actual = palette
      ? [...palette.querySelectorAll(':scope > button')].map(function (button) { return button.dataset.action; }).join(',')
      : '';
    var iconsPresent = palette && [...palette.querySelectorAll(':scope > button')].every(function (button) {
      return button.querySelector(':scope > .ev-action-icon');
    });
    if (!palette) {
      var replacement = chromeControls(actions, true);
      replacement.classList.add('ev-section-palette');
      replacement.setAttribute('data-toolbox', '');
      root.appendChild(replacement);
      palette = replacement;
    } else if (actual !== expected || !iconsPresent) {
      replacePaletteActions(palette, actions);
    }
    ensurePalettePlaceholders(palette);
    var header = palette.querySelector(':scope > .ev-section-palette-header');
    if (!header) {
      header = element('header', 'ev-section-palette-header');
      header.setAttribute('data-chrome', '');
      header.setAttribute('data-section-palette-header', '');
      palette.insertBefore(header, palette.firstChild);
    }
    // Visibility is owned by the palette lifecycle below. Keep the existing
    // settled frame alive during a chrome refresh, but never let action
    // replacement skip the opening state.
    setPalettePhaseVisual(palette, palettePhase);
    refreshSharedPaletteState(paletteOwnerTarget(), palette);
    updateSectionPaletteHeader(paletteOwnerTarget());
    return palette;
  }

  function ensureSectionChrome(section) {
    var h2 = section.querySelector(':scope > h2.ev-title');
    if (!h2) {
      h2 = element('h2', 'ev-title');
      section.insertBefore(h2, section.firstChild);
    }
    var num = h2.querySelector(':scope > .ev-num');
    if (!num) {
      num = element('span', 'ev-num');
      num.setAttribute('data-chrome', '');
      h2.insertBefore(num, h2.firstChild);
    }
    // 0027: the section-title drag handle, always the h2's first child
    var handle = h2.querySelector(':scope > .ev-drag-handle');
    if (!handle) h2.insertBefore(makeDragHandle(), num);
    var title = h2.querySelector(':scope > .ev-title-text');
    if (!title) {
      title = element('span', 'ev-text ev-title-text');
      h2.insertBefore(title, num.nextSibling);
    }
    title.setAttribute('contenteditable', 'true');
    var body = section.querySelector(':scope > .ev-body');
    if (!body) section.appendChild(element('div', 'ev-body'));
  }

  function ensureItemChrome(item) {
    if (!item.querySelector(':scope > .ev-drag-handle')) {
      item.insertBefore(makeDragHandle(), item.firstChild);
    }
    ensureCopyOverlay(item);
    if (item.classList.contains('ev-screenshot')) {
      refreshScreenshotActions(item); // 0066 (§27): the rename button tracks the src
    } else {
      // 0107 (SPEC §29): the legacy row chrome mirrors the shared toolbox.
      var actions = contentRowActionsFor(item) || itemActions(false);
      ensureControls(item, actions);
    }
    // 0051 (SPEC §23): the standalone toggle is stateful — the highlight
    // follows the shot's data-standalone marker (content, adopted as-is).
    if (item.classList.contains('ev-screenshot')) {
      var standaloneBtn = item.querySelector(':scope > .ev-controls [data-action="standalone"]');
      if (standaloneBtn) {
        if (item.hasAttribute('data-standalone')) standaloneBtn.setAttribute('data-active', 'true');
        else standaloneBtn.removeAttribute('data-active');
      }
    }
    if (item.classList.contains('ev-code')) {
      var softWrapBtn = item.querySelector(':scope > .ev-controls [data-action="soft-wrap"]');
      if (softWrapBtn) {
        softWrapBtn.setAttribute('aria-pressed', item.hasAttribute('data-soft-wrap') ? 'true' : 'false');
        if (item.hasAttribute('data-soft-wrap')) softWrapBtn.setAttribute('data-active', 'true');
        else softWrapBtn.removeAttribute('data-active');
      }
    }
    var image = item.querySelector(':scope > img.ev-img');
    if (image) {
      image.addEventListener('load', onScreenshotImageLoad);
      ensureFilenameLabel(item, image);
    }
  }

  // 0063 (SPEC §26): filename label — chrome, derived from src, never persisted.
  // Only for assets/ images; data-URL images get no label. Called from
  // ensureItemChrome (boot + chrome re-render) and after paste.
  function ensureFilenameLabel(item, image) {
    var src = image.getAttribute('src') || '';
    var existingLabel = item.querySelector(':scope > .ev-filename');
    if (src.indexOf('assets/') === 0) {
      var name = decodeURIComponent(src.slice(src.lastIndexOf('/') + 1));
      if (!existingLabel) {
        existingLabel = element('span', 'ev-filename');
        existingLabel.setAttribute('data-chrome', '');
        // insert after img, before caption (or controls if no caption)
        var caption = item.querySelector(':scope > .ev-caption');
        if (caption) item.insertBefore(existingLabel, caption);
        else item.insertBefore(existingLabel, image.nextSibling);
      }
      existingLabel.textContent = name;
    } else if (existingLabel) {
      existingLabel.remove(); // data-URL or no src — no label
    }
  }

  // 0049: screenshot display width is always bounded by its section body.
  // Fixed presets are CSS rules; stepped widths are clean row metadata plus
  // the image's persisted inline width, still capped by .ev-img max-width.
  function screenshotAvailableWidth(screenshot) {
    var body = screenshot.parentElement;
    return body && body.clientWidth > 0 ? body.clientWidth : Infinity;
  }

  function screenshotDisplayWidth(screenshot) {
    var available = screenshotAvailableWidth(screenshot);
    var size = screenshot.dataset.size;
    if (size === 'small') return Math.min(320, available);
    if (size === 'medium') return Math.min(640, available);
    if (size === 'large') return Math.min(960, available);
    if (size === 'page-width') return available;
    if (size === 'custom') return Math.min(Number(screenshot.dataset.width) || 160, available);
    var img = screenshot.querySelector(':scope > img.ev-img');
    return Math.min((img && img.naturalWidth) || 160, available);
  }

  function updateScreenshotMetadataWidth(screenshot) {
    var image = screenshot.querySelector(':scope > img.ev-img');
    if (!image) return;
    if (!screenshot.hasAttribute('data-standalone')) {
      screenshot.style.removeProperty('--ev-standalone-image-width');
      return;
    }
    // Reflow without the old measurement first. This lets a resized row
    // recalculate the image's responsive width instead of trapping it at a
    // stale pixel value from the previous viewport.
    screenshot.style.removeProperty('--ev-standalone-image-width');
    var width = image.getBoundingClientRect().width;
    if (width > 0) screenshot.style.setProperty('--ev-standalone-image-width', width + 'px');
  }

  // The screenshot handle is positioned over the image rather than in the
  // document gutter. The image can be centered, right-aligned, or responsive,
  // so use rendered geometry instead of assuming the image starts at the
  // screenshot item's content edge. The handle is chrome, making these inline
  // offsets safe to keep on the live node; serialization removes the node.
  function updateScreenshotHandlePosition(screenshot) {
    var image = screenshot.querySelector(':scope > img.ev-img');
    var handle = screenshot.querySelector(':scope > .ev-drag-handle');
    if (!image || !handle) return;
    var imageRect = image.getBoundingClientRect();
    if (!imageRect.width || !imageRect.height) {
      handle.style.removeProperty('left');
      handle.style.removeProperty('top');
      return;
    }
    if (screenshot.hasAttribute('data-standalone')) {
      // A standalone shot in a row is a grid container whose image and
      // handle share one grid area (row 1 / column 1). For an
      // absolutely-positioned grid child the browser resolves top/left
      // against that grid area, not the item's padding box — and the area
      // is sized by the image alone, so it already starts at the image's
      // top-left corner. The constant inset is exact here; an
      // item-relative offset would land right of the corner by the
      // centered column's inset.
      handle.style.left = '2px';
      handle.style.top = '2px';
      return;
    }
    var itemRect = screenshot.getBoundingClientRect();
    handle.style.left = (imageRect.left - itemRect.left + 2) + 'px';
    handle.style.top = (imageRect.top - itemRect.top + 2) + 'px';
  }

  function updateScreenshotSizeControls(screenshot) {
    updateScreenshotMetadataWidth(screenshot);
    updateScreenshotHandlePosition(screenshot);
    var controls = screenshot.querySelector(':scope > .ev-controls');
    if (!controls) return;
    var available = screenshotAvailableWidth(screenshot);
    if (!isFinite(available)) return;
    var width = screenshotDisplayWidth(screenshot);
    var minimum = Math.min(160, available);
    var larger = controls.querySelector('[data-action="size-larger"]');
    var smaller = controls.querySelector('[data-action="size-smaller"]');
    if (larger) larger.disabled = width >= available;
    if (smaller) smaller.disabled = width <= minimum;
  }

  function onScreenshotImageLoad(event) {
    var screenshot = event.target.closest('.ev-screenshot');
    if (screenshot) updateScreenshotSizeControls(screenshot);
  }

  function applyScreenshotSize(screenshot, size) {
    var img = screenshot.querySelector(':scope > img.ev-img');
    if (!img) return;
    var available = screenshotAvailableWidth(screenshot);
    if (size === 'larger' || size === 'smaller') {
      var minimum = Math.min(160, available);
      var next = screenshotDisplayWidth(screenshot) + (size === 'larger' ? 80 : -80);
      next = Math.max(minimum, Math.min(next, available));
      screenshot.dataset.size = 'custom';
      screenshot.dataset.width = String(next);
      img.style.width = next + 'px';
    } else {
      screenshot.dataset.size = size;
      delete screenshot.dataset.width;
      img.style.removeProperty('width');
    }
    updateScreenshotSizeControls(screenshot);
  }

  function refreshScreenshotSizeControls() {
    document.querySelectorAll('#evidence .ev-screenshot').forEach(updateScreenshotSizeControls);
  }

  var screenshotSizeObserver = null;

  function observeScreenshotSizeContainers() {
    if (!window.ResizeObserver) return;
    if (!screenshotSizeObserver) screenshotSizeObserver = new window.ResizeObserver(refreshScreenshotSizeControls);
    document.querySelectorAll('#evidence .ev-body').forEach(function (body) {
      screenshotSizeObserver.observe(body);
    });
  }

  // 0042 (SPEC §20): the example dropdown's open state. Chrome — the
  // dropdown closes on entry click, Esc, click outside, re-click, and
  // once the confirmation resolves.
  var exampleMenuOpen = false;

  function setExampleMenu(open) {
    exampleMenuOpen = open;
    var menuEl = document.getElementById('example-menu');
    if (menuEl) menuEl.classList.toggle('open', open);
  }

  // 0103: appearance is browser chrome, not evidence content. The active
  // scheme lives on <html> only while this page is open; saved manual choice
  // lives in origin storage where the browser provides it.
  var THEME_STORAGE_KEY = 'test-evidence-theme';
  var themeMediaQuery = null;
  var manualThemeChoice = false;
  var currentTheme = 'light';

  function targetTheme() {
    return currentTheme === 'light' ? 'dark' : 'light';
  }

  function updateThemeToggle(button) {
    var target = targetTheme();
    button.textContent = target === 'dark' ? '☾' : '☀';
    button.setAttribute('aria-label', 'Switch to ' + target + ' appearance');
    button.title = 'Switch to ' + target + ' appearance';
  }

  function setThemeAppearance(theme) {
    currentTheme = theme;
    document.documentElement.setAttribute('data-theme', theme);
    var button = document.getElementById('theme-toggle');
    if (button) updateThemeToggle(button);
  }

  function toggleThemeAppearance() {
    manualThemeChoice = true;
    var nextTheme = targetTheme();
    setThemeAppearance(nextTheme);
    try {
      window.localStorage.setItem(THEME_STORAGE_KEY, nextTheme);
    } catch (_) {
      // Storage can be disabled (notably for file: URLs); this page's manual
      // selection remains active until it is closed.
    }
  }

  function initializeThemeAppearance() {
    try {
      var stored = window.localStorage.getItem(THEME_STORAGE_KEY);
      if (stored === 'light' || stored === 'dark') {
        manualThemeChoice = true;
        setThemeAppearance(stored);
        return;
      }
    } catch (_) {
      // Continue with the device preference when origin storage is unavailable.
    }
    try {
      themeMediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
    } catch (_) {
      themeMediaQuery = null;
    }
    setThemeAppearance(themeMediaQuery && themeMediaQuery.matches ? 'dark' : 'light');
    if (themeMediaQuery) {
      var onSystemThemeChange = function (event) {
        if (!manualThemeChoice) setThemeAppearance(event.matches ? 'dark' : 'light');
      };
      if (typeof themeMediaQuery.addEventListener === 'function') {
        themeMediaQuery.addEventListener('change', onSystemThemeChange);
      } else if (typeof themeMediaQuery.addListener === 'function') {
        themeMediaQuery.addListener(onSystemThemeChange);
      }
    }
  }

  // Keep the Save warning tied to authored evidence mutations. Transient
  // layout stamps and interaction markers are ignored because serialize()
  // strips them from the saved document.
  var saveRevision = 0;
  var savedRevision = 0;
  var saveInProgress = false;
  var saveMutationObserver = null;
  var TRANSIENT_EVIDENCE_ATTRIBUTES = [
    'contenteditable', 'data-depth', 'data-rail', 'data-palette-active',
    'data-print-hidden', 'data-key-w', 'data-key-clamped',
    'data-value-multiline', 'data-editing',
  ];

  function updateSaveWarning() {
    var saveButton = document.getElementById('save-btn');
    if (!saveButton) return;
    var unsaved = saveRevision !== savedRevision;
    saveButton.classList.toggle('has-unsaved-changes', unsaved || saveInProgress);
    saveButton.textContent = saveInProgress
      ? 'Saving...'
      : (unsaved ? 'Save!' : (savedRevision > 0 ? 'Saved' : 'Save'));
    if (!fileSystemAccessSupported) {
      saveButton.disabled = true;
      saveButton.title = 'Saving requires a Chromium-based browser with File System Access';
      return;
    }
    saveButton.disabled = saveInProgress;
    if (unsaved) saveButton.title = 'Unsaved changes — save to keep your edits.';
    else if (savedRevision > 0) saveButton.title = 'There are no current unsaved changes.';
    else saveButton.removeAttribute('title');
  }

  function mutationIsAuthored(record) {
    var target = record.target.nodeType === 1 ? record.target : record.target.parentElement;
    if (target && target.closest && target.closest('[data-chrome]')) return false;
    if (record.type === 'attributes') {
      if (TRANSIENT_EVIDENCE_ATTRIBUTES.includes(record.attributeName)) return false;
      if (record.attributeName === 'style' && target &&
          (target.id === 'evidence' || target.matches('.ev-property'))) return false;
    }
    if (record.type === 'childList') {
      var changedNodes = [...record.addedNodes, ...record.removedNodes];
      if (changedNodes.length && changedNodes.every(function (node) {
        return node.nodeType === 1 && node.hasAttribute('data-chrome');
      })) return false;
    }
    return true;
  }

  function recordEvidenceMutations(records) {
    if (!records.some(mutationIsAuthored)) return;
    saveRevision += 1;
    updateSaveWarning();
  }

  function revisionForSave() {
    if (saveMutationObserver) recordEvidenceMutations(saveMutationObserver.takeRecords());
    return saveRevision;
  }

  function markRevisionSaved(revision) {
    if (saveRevision === revision) savedRevision = revision;
    updateSaveWarning();
  }

  function finishSaveState() {
    saveInProgress = false;
    updateSaveWarning();
  }

  function initializeSaveWarning() {
    updateSaveWarning();
    var root = document.getElementById('evidence');
    if (!root || !window.MutationObserver) return;
    saveMutationObserver = new window.MutationObserver(recordEvidenceMutations);
    saveMutationObserver.observe(root, {
      subtree: true,
      childList: true,
      characterData: true,
      attributes: true,
    });
  }

    document.querySelectorAll('#evidence .ev-url').forEach(ensureUrlRowChrome);
    document.querySelectorAll('#evidence .ev-shot-row').forEach(ensureShotRowChrome); // 0051 (§23): the row strips, like all chrome
    // boot strips contenteditable defensively (§4.1); restore it on the editables (§3)
    document.querySelectorAll('#evidence ' + EDITABLE_SELECTOR).forEach(function (el) {

  // Boot (SPEC §4): idempotent

  function seedUsedNames() {

  function boot() {
    var root = document.getElementById('evidence');
    root.querySelectorAll('[data-chrome]').forEach(function (el) { el.remove(); });
    root.querySelectorAll('[data-palette-active]').forEach(function (el) {
      el.removeAttribute('data-palette-active');
    });
    // 0044 (§21): the TOC body-state marker is chrome — a saved file never
    // carries it, but boot tolerates anything: every boot is expanded
    document.body.classList.remove('toc-collapsed');
    // 0119: Help is closed at boot; an open Help panel is never session content.
    document.body.classList.remove('help-open');
    document.body.classList.remove('panel-resizing');
    document.body.style.removeProperty('--ev-toc-expanded-width');
    document.body.style.removeProperty('--ev-help-panel-width');
    if (!document.body.getAttribute('style')) document.body.removeAttribute('style');
    root.querySelectorAll('[contenteditable]').forEach(function (el) { el.removeAttribute('contenteditable'); });
    // 0036 (§4/§18): the alignment stamp is chrome — strip it defensively
    // (saved files never carry it) and let refreshChrome recompute it
    root.querySelectorAll('.ev-property[data-key-w]').forEach(function (row) {

    // 0038 (§18 amended): the clamped-column marker is chrome too
    root.querySelectorAll('.ev-property[data-key-clamped]').forEach(function (row) {

    });
    root.querySelectorAll('.ev-property[data-value-multiline]').forEach(function (row) {
      row.removeAttribute('data-value-multiline');
    });
    ensureDocTitle(); // 0039 (§4/§19): the title row is content, always first
    // 0040 (§2, §13 removed): bare boot — the starter skeleton is gone. An
    // empty root stays exactly the title row (§19): the fresh template and a
    // re-opened all-deleted session are the same document.
    seedUsedNames(); // §4.5
    renderHelpPanel(); // 0119: Help is static browser chrome, created once per boot
    refreshChrome(); // stamps contenteditable on the title row's .ev-text span (§3)
    syncTabTitle(); // 0039 (§19): boot sync of the tab <title>
    // 0040 (§4.7/§19): focus the title field on every load — a bare
    // document and a re-opened populated document alike — after all chrome
    // is rendered. The §17 wash on the title row is the intended first
    // frame: it tells the user where the keyboard is.
    root.querySelector(':scope > h1.ev-doc-title > .ev-doc-title-text').focus();
    initMode(); // §4.4: restore the remembered handle, set the mode indicator
    initializeSaveWarning();

    }
