  // §4.4 / §5.1: restore this document's stored directory handle, then query its
  // permission. 'prompt'/'denied' are not asked about here — asking must
  // happen inside the Save gesture. A broken handle store must not block
  // capture: fall back.
  async function initMode() {
    if (mode === 'primary') {
      try {
        var restored = await idbGetHandle();
        if (restored) {
          dirHandle = restored;
          await restored.queryPermission({ mode: 'readwrite' });
        }
      } catch {
        switchToFallback(); // broken handle store → fallback (never block capture)
      }
    }
  }

  // ---------------------------------------------------------------------
  // 0026/0027: core mutation seam (0025's locked decision) — the move
  // logic lives in one function: DOM move + cycle rejection (sections)
  // + renumber + chrome re-render. The pointer drag supplies (row, target
  // container, gap element) — a section's target is a section body
  // (re-nest) or #evidence itself (top-level gap = promote/keep top
  // level); a leaf's target is a section body only. No save is triggered.
  // ---------------------------------------------------------------------

  function moveElement(row, target, beforeEl, opts) {
    if (!row || !target) return false;
    // Already in this gap: a no-op move (and insertBefore(row, row) throws).
    // In its own row gap the same check applies — an in-place drop never
    // moves the shot or rebuilds the row.
    if (row.parentElement === target && (row === beforeEl || row.nextElementSibling === beforeEl)) return true;
    if (row.matches('.ev-shot-row')) {
      // 0090: whole-row drags only target section-body-level gaps. A row
      // dropped at a gap touching another row merges its shots into that
      // wrapper; an isolated body gap moves the wrapper intact.
      if (!target.matches('.ev-body')) return false;
      if (beforeEl && beforeEl.parentElement !== target) return false;
      placeShotRow(row, target, beforeEl, opts && opts.rowDrop);
      refreshChrome();
      return true;
    }
    if (row.matches('.ev-section')) {
      // 0027 cycle rule (SPEC §15): a section can never be dropped onto
      // itself or into its own content tree — such a drop is a no-op.
      if (target === row || row.contains(target) ||
          (beforeEl && (beforeEl === row || row.contains(beforeEl)))) return false;
    } else {
      // leaves never land at the top level; a row is a valid leaf target —
      // the drop line snaps to gaps inside a row; a shot drop joins the
      // row, a non-image drop splits it (0051/0054, SPEC §15/§23)
      if (!target.matches('.ev-body, .ev-shot-row')) return false;
    }
    if (beforeEl && beforeEl.parentElement !== target) return false;
    placeWithShotRows(row, target, beforeEl, opts);
    refreshChrome(); // renumber (§7) + chrome re-render (+ section buttons); never a save
    return true;
  }

  // 0090: move a screenshot row as one authored group. The destination row
  // owns alignment after a merge; an isolated gap moves the wrapper and its
  // alignment intact. Capturing the shots before insertion keeps their order
  // independent of the destination's existing children.
  function placeShotRow(sourceRow, target, beforeEl, rowDrop) {
    var previous = beforeEl ? beforeEl.previousElementSibling : target.lastElementChild;
    var destination = rowDrop && rowDrop.row && rowDrop.row.parentElement === target
      ? rowDrop.row
      : beforeEl && beforeEl.matches('.ev-shot-row')
        ? beforeEl
        : previous && previous.matches('.ev-shot-row') ? previous : null;
    if (!destination || destination === sourceRow) {
      target.insertBefore(sourceRow, beforeEl);
      return;
    }

    var shots = rowShots(sourceRow);
    var prepend = rowDrop ? rowDrop.side === 'before' : beforeEl === destination;
    if (prepend) {
      var first = rowShots(destination)[0] || null;
      shots.forEach(function (shot) { destination.insertBefore(shot, first); });
    } else {
      shots.forEach(function (shot) { destination.appendChild(shot); });
    }
    sourceRow.remove();
  }

  // 0051/0054 (SPEC §23): the row mechanics of a move. A SCREENSHOT move
  // never splits anything: the shot JOINS a row — the target row at the
  // requested gap (a within-row drop is a plain reorder), or the row a
  // section-body gap touches (right after it: at its end; right before it:
  // at its start); an isolated body gap (adjacent to no row) wraps it in a
  // fresh single-image row at the top/center defaults. The source row keeps
  // its remaining shots together with its alignment and is discarded only
  // when left with none. A NON-IMAGE unit (comment, property, subsection,
  // section) dropped at a gap inside a row still splits that row in two
  // around it: the first half keeps the row's alignment, the second is a
  // fresh default-alignment wrapper, and a half left with zero shots is
  // discarded, its alignment state lost with it.
  function rowShots(row) {
    return [...row.querySelectorAll(':scope > .ev-screenshot')];
  }

  // A half with zero members is null (discarded); otherwise a fresh
  // wrapper. stateSource (the row being split) copies its alignment to the
  // first half only — the second half is always default.
  function buildRowHalf(members, stateSource) {
    if (members.length === 0) return null;
    var row = makeShotRow();
    if (stateSource) {
      var v = stateSource.getAttribute('data-valign');
      var h = stateSource.getAttribute('data-halign');
      if (v) row.setAttribute('data-valign', v);
      if (h) row.setAttribute('data-halign', h);
    }
    members.forEach(function (s) { row.appendChild(s); });
    return row;
  }

  function placeWithShotRows(unit, target, beforeEl, opts) {
    if (unit.matches('.ev-screenshot')) placeShot(unit, target, beforeEl, opts);
    else placeSplittingUnit(unit, target, beforeEl); // non-image: opts.isolated is inert
  }

  // A screenshot move: the shot joins a row and is never left a bare body
  // child (0054, SPEC §15/§23). The gap decides which row: an in-row gap →
  // that row at the gap; a body gap → the row it touches (the element just
  // before the gap, then just after it); no row touched → a new single-
  // image row (defaults) at the gap. 0055: the pointer engine passes
  // opts.isolated for a spatially isolated drop — a body gap the pointer
  // was beyond the 24px join boundary from every row — forcing the new
  // single-image row even where the 0054 DOM-adjacency baseline would join
  // the row the gap touches. Direct (seam) calls keep the 0054 baseline.
  // Identity, caption, sizing and standalone state ride on the node
  // itself — the DOM move keeps them.
  function placeShot(unit, target, beforeEl, opts) {
    var sourceRow = unit.parentElement && unit.parentElement.matches('.ev-shot-row')
      ? unit.parentElement : null;
    var destRow = null;
    if (target.matches('.ev-shot-row')) {
      destRow = target; // in-row gap: join it at the requested position
    } else if (!(opts && opts.isolated)) {
      // section-body gap: the element just before it, then the element
      // just after (beforeEl); a gap touching a row joins that row
      var prev = beforeEl ? beforeEl.previousElementSibling : target.lastElementChild;
      if (prev && prev.matches('.ev-shot-row')) destRow = prev; // after it: at its end
      else if (beforeEl && beforeEl.matches('.ev-shot-row')) destRow = beforeEl; // before it: at its start
    }
    if (destRow) {
      var ref = null; // null → the row's end (after the strip, after all shots)
      if (target === destRow) ref = beforeEl; // in-row gap: before that shot
      else if (beforeEl === destRow) {        // body gap right before the row: before its first shot
        var first = rowShots(destRow);
        ref = first.length ? first[0] : null;
      }
      destRow.insertBefore(unit, ref);
    } else {
      var row = makeShotRow(); // isolated drop: a new single-image row, top/center defaults
      row.appendChild(unit);
      target.insertBefore(row, beforeEl);
      ensureShotRowChrome(row); // the new row comes up with its (hidden) strip
    }
    if (sourceRow && sourceRow !== destRow &&
        !sourceRow.querySelector(':scope > .ev-screenshot')) {
      sourceRow.remove(); // the emptied source row is discarded, alignment state included
    }
  }

  // A non-image unit at a gap inside a row: the row splits in two around
  // it (0051, SPEC §23). Everything is captured before any DOM mutation.
  function placeSplittingUnit(unit, target, beforeEl) {
    if (!target.matches('.ev-shot-row')) { target.insertBefore(unit, beforeEl); return; }
    var row = target;
    var body = row.parentElement;
    var after = row.nextElementSibling;
    var members = rowShots(row);
    var gap = beforeEl ? members.indexOf(beforeEl) : members.length;
    var r1 = buildRowHalf(members.slice(0, gap), row);
    var r2 = buildRowHalf(members.slice(gap), null);
    row.remove();
    var anchor = after;
    if (r2) { body.insertBefore(r2, anchor); anchor = r2; }
    if (r1) body.insertBefore(r1, anchor);
    body.insertBefore(unit, r2 || after); // between the halves
  }

  // ---------------------------------------------------------------------
  // 0026: leaf-row drag & drop (SPEC §15). Pointer-based, deliberately not
  // native HTML5 drag & drop: the handle only starts a drag (~4px threshold,
  // a plain click is a no-op), the row stays in place dimmed (no floating
  // clone), and a single drop line snaps to the nearest gap of the
  // innermost section under the pointer. Esc or a release while the line
  // is not shown cancels; the DOM move happens only on a real drop. While
  // the pointer is near the viewport's top/bottom edge the page
  // auto-scrolls. Leaves only ever land in section bodies (the move seam
  // rejects anything else).
  // ---------------------------------------------------------------------

  var LEAF_ROW_SELECTOR = '.ev-comment, .ev-code, .ev-property, .ev-file, .ev-url, .ev-screenshot';
  var DRAG_THRESHOLD_PX = 4; // below this a handle press is a click, not a drag
  var AUTO_SCROLL_EDGE_PX = 40;
  var AUTO_SCROLL_STEP_PX = 12;
  var drag = null; // { row, kind, startX, startY, started, line, isolated, tocEntry, tocTarget }

  // 0111 (SPEC §21): a completed or cancelled TOC drag can still fire the
  // entry's click (the browser's own click after the release, and the
  // release after an Esc cancel) — a real drag never navigates. Armed
  // while a TOC drag is in flight; cleared by the swallowed click, by a
  // fresh pointerdown on an entry (a new gesture), and by a short safety
  // timeout. A ≤4px press never arms it (the drag never starts).
  var tocDragClickSuppressed = false;
  var tocDragSuppressionTimer = null;

  function armTocDragClickSuppression() {
    tocDragClickSuppressed = true;
    if (tocDragSuppressionTimer !== null) window.clearTimeout(tocDragSuppressionTimer);
    tocDragSuppressionTimer = window.setTimeout(function () {
      tocDragSuppressionTimer = null;
      tocDragClickSuppressed = false;
    }, 1000);
  }

  function clearTocDragClickSuppression() {
    tocDragClickSuppressed = false;
    if (tocDragSuppressionTimer !== null) {
      window.clearTimeout(tocDragSuppressionTimer);
      tocDragSuppressionTimer = null;
    }
  }

  // 0078/0080/0085/0086/0092: the section palette is one transient live-DOM
  // panel and one section marker. A mouse right-click on a title is the only
  // pointer activation path; focus can keep an already-visible palette
  // available to keyboard users, but never opens one.
  var paletteOwnerSection = null;
  var paletteOwnerRow = null;
  var paletteFocusTarget = null;
  var paletteDismissTimer = null;
  var paletteAnchor = null;
  var PALETTE_VIEWPORT_PADDING_PX = 8;
  var PALETTE_EXIT_GRACE_MS = 180;
  var PALETTE_REVEAL_MS = 300;
  var palettePhase = 'closed'; // closed, opening, settled, or closing
  var paletteAnimationTimer = null;
  var paletteAnimationToken = 0;
  var palettePendingActivation = null;
  var paletteDragSuspended = false;

  function sharedSectionPalette() {
    return document.querySelector('#evidence > .ev-section-palette[data-section-palette]');
  }

  function setPaletteControlsInteractive(palette, interactive) {
    if (!palette) return;
    palette.toggleAttribute('data-palette-inert', !interactive);
    palette.querySelectorAll(':scope > button').forEach(function (button) {
      if (interactive) {
        if (!button.hasAttribute('data-palette-tabindex')) return;
        var previous = button.getAttribute('data-palette-tabindex');
        if (previous) button.setAttribute('tabindex', previous);
        else button.removeAttribute('tabindex');
        button.removeAttribute('data-palette-tabindex');
      } else if (!button.hasAttribute('data-palette-tabindex')) {
        button.setAttribute('data-palette-tabindex', button.getAttribute('tabindex') || '');
        button.setAttribute('tabindex', '-1');
      }
    });
  }

  function setPalettePhaseVisual(palette, phase) {
    if (!palette) return;
    palette.toggleAttribute('data-palette-visible', phase === 'settled' || phase === 'opening');
    palette.toggleAttribute('data-palette-opening', phase === 'opening');
    palette.toggleAttribute('data-palette-closing', phase === 'closing');
    if (phase === 'closed') palette.removeAttribute('data-palette-phase');
    else palette.setAttribute('data-palette-phase', phase);
    setPaletteControlsInteractive(palette, phase === 'settled');
  }

  function cancelPaletteAnimation() {
    paletteAnimationToken++;
    if (paletteAnimationTimer !== null) {
      window.clearTimeout(paletteAnimationTimer);
      paletteAnimationTimer = null;
    }
  }

  function prefersReducedPaletteMotion() {
    return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  }

  // jsdom has no CSS animation engine, so completing immediately there keeps
  // the DOM interaction tests synchronous. Chromium uses the real 300ms
  // animation and the same state transitions.
  function supportsPaletteAnimation() {
    return typeof window.AnimationEvent === 'function';
  }

  function finishPaletteOpening(token) {
    if (token !== paletteAnimationToken || palettePhase !== 'opening') return;
    paletteAnimationTimer = null;
    palettePhase = 'settled';
    setPalettePhaseVisual(sharedSectionPalette(), palettePhase);
  }

  function finishPaletteClosing(token, afterClose) {
    if (token !== paletteAnimationToken || palettePhase !== 'closing') return;
    paletteAnimationTimer = null;
    palettePhase = 'closed';
    var palette = sharedSectionPalette();
    setPalettePhaseVisual(palette, palettePhase);
    if (palette) {
      palette.style.removeProperty('--ev-palette-left');
      palette.style.removeProperty('--ev-palette-top');
    }
    if (afterClose) afterClose();
  }

  function startPaletteOpening(palette) {
    if (!palette) return;
    cancelPaletteAnimation();
    palettePhase = 'opening';
    setPalettePhaseVisual(palette, palettePhase);
    if (prefersReducedPaletteMotion() || !supportsPaletteAnimation()) {
      palettePhase = 'settled';
      setPalettePhaseVisual(palette, palettePhase);
      return;
    }
    var token = paletteAnimationToken;
    paletteAnimationTimer = window.setTimeout(function () {
      finishPaletteOpening(token);
    }, PALETTE_REVEAL_MS);
  }

  function startPaletteClosing(afterClose) {
    var palette = sharedSectionPalette();
    if (!palette || palettePhase === 'closed') {
      if (afterClose) afterClose();
      return;
    }
    cancelPaletteAnimation();
    palettePhase = 'closing';
    setPalettePhaseVisual(palette, palettePhase);
    if (prefersReducedPaletteMotion() || !supportsPaletteAnimation()) {
      palettePhase = 'closed';
      setPalettePhaseVisual(palette, palettePhase);
      if (afterClose) afterClose();
      return;
    }
    var token = paletteAnimationToken;
    paletteAnimationTimer = window.setTimeout(function () {
      finishPaletteClosing(token, afterClose);
    }, PALETTE_REVEAL_MS);
  }

  function makePalettePlaceholder(half) {
    var placeholder = element('div', 'ev-palette-placeholder');
    placeholder.setAttribute('data-chrome', '');
    placeholder.setAttribute('data-palette-placeholder', '');
    placeholder.setAttribute('data-palette-half', half);
    for (var i = 0; i < 3; i++) {
      placeholder.appendChild(element('span', 'ev-palette-placeholder-bar'));
    }
    return placeholder;
  }

  function ensurePalettePlaceholders(palette) {
    if (!palette) return;
    ['upper', 'lower'].forEach(function (half) {
      var placeholder = palette.querySelector(
        ':scope > .ev-palette-placeholder[data-palette-half="' + half + '"]',
      );
      if (!placeholder) palette.insertBefore(makePalettePlaceholder(half), palette.firstChild);
    });
  }

  function updateSectionPaletteHeader(target) {
    var palette = sharedSectionPalette();
    var header = palette && palette.querySelector(':scope > .ev-section-palette-header');
    if (!header) return;
    if (target && target.matches('.ev-screenshot, .ev-shot-row, .ev-comment, .ev-code, .ev-property, .ev-file, .ev-url')) {
      if (target.matches('.ev-screenshot')) header.textContent = 'Screenshot';
      else if (target.matches('.ev-shot-row')) header.textContent = 'Screenshot row';
      else {
        header.textContent = target.classList.contains('ev-url') ? 'URL'
          : target.classList.contains('ev-code') ? 'Code'
          : target.classList.contains('ev-property') ? 'Property'
            : target.classList.contains('ev-file') ? 'File' : 'Comment';
      }
      return;
    }
    var number = target && target.querySelector(':scope > h2.ev-title > .ev-num');
    header.textContent = number && number.textContent.trim()
      ? 'Section ' + number.textContent.trim() : '';
  }

  function clearPaletteDismissTimer() {
    if (paletteDismissTimer !== null) {
      window.clearTimeout(paletteDismissTimer);
      paletteDismissTimer = null;
    }
  }

  function positionSectionPalette(target) {
    if (!target || !target.isConnected || dragActive()) return;
    var palette = sharedSectionPalette();
    if (!palette) return;

    // The panel is fixed and centered on the activation point. Clamp the
    // point by half the rendered panel size so the whole toolbox stays in the
    // viewport, including when labels wrap or the panel becomes scrollable.
    var paletteRect = palette.getBoundingClientRect();
    var viewportWidth = Number(window.innerWidth) || 0;
    var viewportHeight = Number(window.innerHeight) || 0;
    var width = paletteRect.width || 0;
    var height = paletteRect.height || 0;
    var left = paletteAnchor ? Number(paletteAnchor.x) : viewportWidth / 2;
    var top = paletteAnchor ? Number(paletteAnchor.y) : viewportHeight / 2;
    if (!Number.isFinite(left)) left = viewportWidth / 2;
    if (!Number.isFinite(top)) top = viewportHeight / 2;
    if (viewportWidth > 0) {
      var minLeft = PALETTE_VIEWPORT_PADDING_PX + width / 2;
      var maxLeft = viewportWidth - PALETTE_VIEWPORT_PADDING_PX - width / 2;
      left = Math.min(Math.max(left, minLeft), Math.max(minLeft, maxLeft));
    }
    if (viewportHeight > 0) {
      var minTop = PALETTE_VIEWPORT_PADDING_PX + height / 2;
      var maxTop = viewportHeight - PALETTE_VIEWPORT_PADDING_PX - height / 2;
      top = Math.min(Math.max(top, minTop), Math.max(minTop, maxTop));
    }
    palette.style.setProperty('--ev-palette-left', Math.round(left) + 'px');
    palette.style.setProperty('--ev-palette-top', Math.round(top) + 'px');
  }

  function positionActivePalette() {
    var active = paletteOwnerTarget();
    if (active) positionSectionPalette(active);
    else refreshPaletteMarker();
  }

  function refreshPaletteMarker() {
    document.querySelectorAll('#evidence [data-palette-active]').forEach(function (target) {
      target.removeAttribute('data-palette-active');
    });
    var palette = sharedSectionPalette();
    // 0080: drag/drop feedback owns the interaction surface while a drag is
    // active; no palette may compete with the drop line or grabbing cursor.
    if (dragActive()) {
      updateSectionPaletteHeader(null);
      if (palette) {
        paletteDragSuspended = palettePhase !== 'closed';
        palette.removeAttribute('data-palette-visible');
        palette.removeAttribute('data-palette-opening');
        palette.removeAttribute('data-palette-closing');
      }
      return;
    }
    var active = paletteOwnerTarget();
    if (active && active.isConnected) {
      active.setAttribute('data-palette-active', '');
      updateSectionPaletteHeader(active);
      if (palette) {
        positionSectionPalette(active);
        if (paletteDragSuspended) {
          paletteDragSuspended = false;
          setPalettePhaseVisual(palette, palettePhase);
        }
      }
    } else {
      paletteOwnerSection = null;
      paletteOwnerRow = null;
      paletteFocusTarget = null;
      paletteAnchor = null;
      updateSectionPaletteHeader(null);
      if (palette) {
        if (palettePhase !== 'closed' && palettePhase !== 'closing') startPaletteClosing();
        else if (palettePhase === 'closed') setPalettePhaseVisual(palette, palettePhase);
      }
    }
  }

  function sectionForTarget(target) {
    return target && target.closest ? target.closest('#evidence .ev-section') : null;
  }

  function sectionForContextTarget(target) {
    if (!target || !target.closest) return null;
    if (target.closest('.ev-drag-handle, .ev-controls, [data-section-palette]')) return null;
    var title = target.closest('h2.ev-title');
    return title && title.closest('#evidence .ev-section');
  }

  function isValidPaletteTarget(target) {
    var root = document.getElementById('evidence');
    return !!(target && target.isConnected && root && root.contains(target) &&
      target.matches('.ev-section, .ev-screenshot, .ev-shot-row, .ev-comment, .ev-code, .ev-property, .ev-file, .ev-url'));
  }

  function paletteOwnerTarget() {
    var target = paletteOwnerRow || paletteOwnerSection;
    if (target && !isValidPaletteTarget(target)) {
      clearPaletteDismissTimer();
      paletteOwnerSection = null;
      paletteOwnerRow = null;
      paletteFocusTarget = null;
      paletteAnchor = null;
      return null;
    }
    return target;
  }

  function paletteTargetForContextTarget(target) {
    if (!target || !target.closest) return null;
    if (target.closest('.ev-drag-handle, .ev-copy-overlay, [data-section-palette]')) return null;
    if (target.closest('.ev-controls')) return null;
    var screenshot = target.closest('#evidence .ev-screenshot');
    if (screenshot) return screenshot;
    var screenshotRow = target.closest('#evidence .ev-shot-row');
    if (screenshotRow) return screenshotRow;
    var row = target.closest('#evidence .ev-comment, #evidence .ev-code, #evidence .ev-property, #evidence .ev-file, #evidence .ev-url');
    if (row) return row;
    return sectionForContextTarget(target);
  }

  function assignPaletteTarget(target, x, y) {
    paletteOwnerSection = target.matches('.ev-section') ? target : null;
    paletteOwnerRow = target.matches('.ev-screenshot, .ev-shot-row, .ev-comment, .ev-code, .ev-property, .ev-file, .ev-url') ? target : null;
    paletteFocusTarget = null;
    paletteAnchor = { x: x, y: y };
    ensureSharedSectionPalette();
    positionSectionPalette(target);
    refreshPaletteMarker();
    startPaletteOpening(sharedSectionPalette());
  }

  function activatePendingPalette() {
    var pending = palettePendingActivation;
    palettePendingActivation = null;
    if (pending && isValidPaletteTarget(pending.target)) {
      activatePalette(pending.target, pending.x, pending.y);
    }
  }

  function activatePalette(target, x, y) {
    if (!target || dragActive()) return;
    clearPaletteDismissTimer();
    var current = paletteOwnerTarget();
    if (palettePhase === 'closing') {
      palettePendingActivation = { target: target, x: x, y: y };
      startPaletteClosing(activatePendingPalette);
      return;
    }
    if (current && current !== target && palettePhase !== 'closed') {
      palettePendingActivation = { target: target, x: x, y: y };
      paletteOwnerSection = null;
      paletteOwnerRow = null;
      paletteFocusTarget = null;
      paletteAnchor = null;
      refreshPaletteMarker();
      startPaletteClosing(activatePendingPalette);
      return;
    }
    if (current === target && (palettePhase === 'settled' || palettePhase === 'opening')) {
      paletteAnchor = { x: x, y: y };
      ensureSharedSectionPalette();
      positionSectionPalette(target);
      refreshPaletteMarker();
      return;
    }
    assignPaletteTarget(target, x, y);
  }

  function closeSectionPalette() {
    clearPaletteDismissTimer();
    palettePendingActivation = null;
    paletteOwnerSection = null;
    paletteOwnerRow = null;
    paletteFocusTarget = null;
    paletteAnchor = null;
    refreshPaletteMarker();
  }

  function lastTopLevelSection() {
    var topSections = [...document.querySelectorAll('#evidence > .ev-section')];
    return topSections.length ? topSections[topSections.length - 1] : null;
  }

  // The global content adds continue into a trailing subsection when the
  // document ends with one. Walk only through trailing section children so a
  // later leaf row deliberately falls back to its top-level owner.
  function sectionAtDocumentEnd() {
    var section = lastTopLevelSection();
    while (section) {
      var body = section.querySelector(':scope > .ev-body');
      var lastChild = body && body.lastElementChild;
      if (!lastChild || !lastChild.matches('.ev-section')) return section;
      section = lastChild;
    }
    return null;
  }

  function sectionForAction(actionBtn) {
    var title = actionBtn.closest ? actionBtn.closest('h2.ev-title') : null;
    if (title) return title.closest('.ev-section');
    var addToolbox = actionBtn.closest ? actionBtn.closest('[data-add-toolbox]') : null;
    if (addToolbox) {
      return actionBtn.dataset.action === 'add-subsection'
        ? lastTopLevelSection()
        : sectionAtDocumentEnd();
    }
    var palette = actionBtn.closest ? actionBtn.closest('[data-section-palette]') : null;
    if (palette) {
      var target = paletteOwnerTarget();
      return target && target.matches('.ev-section') ? target : target && target.closest('.ev-section');
    }
    return actionBtn.closest ? actionBtn.closest('.ev-section') : null;
  }

  function rowForAction(actionBtn) {
    var palette = actionBtn.closest ? actionBtn.closest('[data-section-palette]') : null;
    if (palette) {
      var target = paletteOwnerTarget();
      return target && target.matches('.ev-comment, .ev-code, .ev-property, .ev-file, .ev-url, .ev-screenshot')
        ? target : null;
    }
    return actionBtn.closest
      ? actionBtn.closest('.ev-comment, .ev-code, .ev-property, .ev-file, .ev-url, .ev-screenshot')
      : null;
  }

  // 0107–0109 (SPEC §29): a content add triggered from a row toolbox inserts
  // immediately after the triggering row in the same section body. Only row
  // toolboxes that carry the after-adds supply an anchor — the section
  // toolbox keeps the end-of-body insertion point.
  function afterAddRow(actionBtn) {
    var row = rowForAction(actionBtn);
    if (row && row.matches('.ev-comment, .ev-code, .ev-property, .ev-file, .ev-url')) return row;
    var shotRow = shotRowForAction(actionBtn);
    if (shotRow) return shotRow;
    return row && row.matches('.ev-screenshot') ? row : null;
  }

  function shotRowForAction(actionBtn) {
    var palette = actionBtn.closest ? actionBtn.closest('[data-section-palette]') : null;
    if (palette) {
      var target = paletteOwnerTarget();
      return target && target.matches('.ev-shot-row') ? target : null;
    }
    return actionBtn.closest ? actionBtn.closest('.ev-shot-row') : null;
  }

  function onDocumentFocusIn(event) {
    // Focus is a continuation path only. It can keep a palette that was
    // opened by mouse context-menu interaction alive, but must not open one.
    var palette = sharedSectionPalette();
    if (!paletteOwnerTarget() || !palette || !palette.contains(event.target)) return;
    if (palette.hasAttribute('data-palette-inert')) return;
    clearPaletteDismissTimer();
    paletteFocusTarget = paletteOwnerTarget();
  }

  function onDocumentFocusOut(event) {
    var urlEditor = urlEditorFor(event.target);
    if (urlEditor) {
      var urlRow = urlEditor.closest('.ev-url');
      if (!event.relatedTarget || !urlRow.contains(event.relatedTarget)) finishUrlEditing(urlRow);
    }
    var palette = sharedSectionPalette();
    if (!palette || !palette.contains(event.target)) return;
    if (event.relatedTarget && palette.contains(event.relatedTarget)) return;
    paletteFocusTarget = null;
  }

  // ---------------------------------------------------------------------
  // 0033: hover ancestor rails (SPEC §16). One small delegated hover
  // handler marks the innermost section under the pointer as current and
  // each containing ancestor a1/a2/a3 (deeper clamped to a3); CSS draws
  // the lines from the marks. The chain clears as soon as the pointer
  // leaves the outermost lit section, and is fully suppressed while a drag
  // is in flight (the body drag class). The marks are chrome — §5.3.4
  // strips them on save; hovering never triggers a save.
  // ---------------------------------------------------------------------

  function clearRails() {
    document.querySelectorAll('#evidence .ev-section[data-rail]').forEach(function (s) {
      s.removeAttribute('data-rail');
    });
  }

  function setRails(section) {
    clearRails();
    var level = 0;
    for (var s = section; s; s = s.parentElement.closest('.ev-section'), level++) {
      s.setAttribute('data-rail', level === 0 ? 'current' : 'a' + Math.min(level, 3));
    }
  }

  function dragActive() {
    return document.body.classList.contains('ev-dragging-active');
  }

  function onDocumentMouseOver(event) {
    var palette = sharedSectionPalette();
    if (palette && palette.contains(event.target)) {
      clearPaletteDismissTimer();
      return;
    }
    var ownerSurface = paletteOwnerTarget();
    if (ownerSurface && ownerSurface.contains(event.target)) clearPaletteDismissTimer();
    if (dragActive()) {
      clearRails(); // suppressed while a drag is in flight
      return;
    }
    var section = sectionForTarget(event.target);
    if (!section) { clearRails(); return; } // over the toolbar/page: nothing lit
    setRails(section);
  }

  function onDocumentMouseOut(event) {
    var palette = sharedSectionPalette();
    if (palette && palette.contains(event.target)) {
      if (event.relatedTarget && palette.contains(event.relatedTarget)) return;
      var ownerSurface = paletteOwnerTarget();
      if (event.relatedTarget && ownerSurface && ownerSurface.contains(event.relatedTarget)) {
        clearPaletteDismissTimer();
      } else {
        schedulePaletteDismiss();
      }
      return;
    }
    if (palette && event.relatedTarget && palette.contains(event.relatedTarget)) return;
    var ownerSurface = paletteOwnerTarget();
    if (ownerSurface && ownerSurface.contains(event.target) &&
        (!event.relatedTarget || !ownerSurface.contains(event.relatedTarget))) {
      schedulePaletteDismiss();
    }
    if (dragActive()) { clearRails(); return; }
    // The first mark in document order is the outermost lit section
    // (an ancestor precedes its descendants).
    var outermost = document.querySelector('#evidence .ev-section[data-rail]');
    if (!outermost) return;
    // Still inside the lit subtree: the chain stands (mouseover recomputes
    // the marks if the innermost section changed).
    if (event.relatedTarget && outermost.contains(event.relatedTarget)) return;
    clearRails(); // the pointer left the outermost lit section
  }

  function schedulePaletteDismiss() {
    clearPaletteDismissTimer();
    if (!paletteOwnerTarget()) return;
    paletteDismissTimer = window.setTimeout(function () {
      paletteDismissTimer = null;
      if (paletteFocusTarget) return;
      closeSectionPalette();
    }, PALETTE_EXIT_GRACE_MS);
  }

  function onDocumentContextMenu(event) {
    var root = document.getElementById('evidence');
    if (!root || !root.contains(event.target)) return;
    // The middle pane owns native-menu suppression, including the shared
    // palette. The toolbar, TOC, and page chrome remain browser-native.
    event.preventDefault();
    if (event.button !== 2 || (event.pointerType && event.pointerType !== 'mouse')) return;
    var target = paletteTargetForContextTarget(event.target);
    if (!target) return;
    activatePalette(target, event.clientX, event.clientY);
  }

  // The drop line: one transient horizontal element, at most one at a
  // time, rendered into the target container only while a drag is in
  // flight, removed on drop or cancel; chrome, never persisted.
  function makeDropLine() {
    var div = element('div', 'ev-drop-line');
    div.setAttribute('data-chrome', '');
    return div;
  }

  function cancelDrag() {
    if (!drag) return;
    var canceled = drag;
    drag = null;
    // 0111 (SPEC §21): a TOC drag dims the entry (chrome), never the
    // document section
    (canceled.kind === 'toc' ? canceled.tocEntry : canceled.row).classList.remove('ev-dragging');
    document.body.classList.remove('ev-dragging-active');
    if (canceled.line && canceled.line.parentNode) canceled.line.remove();
    if (canceled.kind === 'toc') setTocDropWash(null); // 0112: the wash is chrome too
    refreshPaletteMarker();
    if (canceled.operation) completeOperation(canceled.operation, 'Move canceled', 'information');
  }

  function onDocumentPointerDown(event) {
    if (event.button !== 0) return;
    if (drag) return; // the app's single pointer drag machine: one drag in flight
    // 0111 (SPEC §21): the whole TOC entry button arms a section drag — the
    // sanctioned exception to §3's "only handles start a drag" (entries are
    // chrome buttons with no editable text). The collapsed panel's tree is
    // hidden — no drag surface.
    var tocEntry = event.target.closest ? event.target.closest('#toc-tree [data-action="toc-goto"]') : null;
    if (tocEntry) {
      if (document.body.classList.contains('toc-collapsed')) return;
      var tocSections = [...document.querySelectorAll('#evidence .ev-section')];
      var section = tocSections[Number(tocEntry.dataset.target)];
      if (!section) return;
      clearTocDragClickSuppression(); // a fresh gesture: any stale suppression is gone
      drag = {
        row: section, kind: 'toc', tocEntry: tocEntry,
        startX: event.clientX, startY: event.clientY,
        started: false, line: null, tocTarget: null,
      };
      return;
    }
    var handle = event.target.closest ? event.target.closest('.ev-drag-handle') : null;
    if (!handle) return;
    var rowHandleOwner = handle.parentElement && handle.parentElement.matches('.ev-shot-row')
      ? handle.parentElement : null;
    var row = rowHandleOwner || handle.closest(LEAF_ROW_SELECTOR);
    var kind = rowHandleOwner ? 'shot-row' : 'item';
    if (!row) {
      // 0027: the section-title handle drags the whole section (subtree)
      var title = handle.closest('h2.ev-title');
      row = title ? title.closest('.ev-section') : null;
    }
    if (!row) return;
    event.preventDefault(); // no text-selection or focus change starts from the grip
    drag = { row: row, kind: kind, startX: event.clientX, startY: event.clientY, started: false, line: null, isolated: false };
  }

  function onDocumentPointerMove(event) {
    if (!drag) return;
    if (!drag.started) {
      if (Math.hypot(event.clientX - drag.startX, event.clientY - drag.startY) < DRAG_THRESHOLD_PX) return;
      drag.started = true;
      drag.operation = beginOperation('Move');
      // 0111 (SPEC §21): a TOC drag dims the entry (chrome) — the document
      // section of the dragged entry is untouched
      (drag.kind === 'toc' ? drag.tocEntry : drag.row).classList.add('ev-dragging'); // dimmed in place — no floating clone
      document.body.classList.add('ev-dragging-active'); // grabbing cursor
      if (drag.kind === 'toc') armTocDragClickSuppression();
      refreshPaletteMarker(); // 0080: suppress section chrome during the drag
      clearRails(); // 0033: the drop line is the spatial signal during a drag
      drag.line = makeDropLine();
    }
    if (drag.kind === 'toc') autoScrollTocTree(event.clientX, event.clientY); // the tree's own scrollport
    else autoScroll(event.clientY); // the page
    positionDropLine(event.clientX, event.clientY);
  }

  function onDocumentPointerUp() {
    if (!drag) return;
    var line = drag.line;
    if (!line || !line.parentNode) {
      // releasing while the line is not shown → cancel: nothing moved
      cancelDrag();
      return;
    }
    // A real drop: the line's own position IS the previewed destination
    // (0055) — release performs exactly the previewed operation. A TOC
    // drag's line sits in the tree, where the mapped document gap was
    // stored when the line last rendered (0111).
    var d = drag;
    drag = null;
    (d.kind === 'toc' ? d.tocEntry : d.row).classList.remove('ev-dragging');
    document.body.classList.remove('ev-dragging-active');
    if (d.kind === 'toc') setTocDropWash(null); // 0112: the wash is chrome too
    refreshPaletteMarker();
    var target;
    var before;
    if (d.kind === 'toc') {
      target = d.tocTarget ? d.tocTarget.container : null;
      before = d.tocTarget ? d.tocTarget.before : null;
    } else {
      target = line.parentNode;
      before = line.nextSibling;
    }
    line.remove();
    var opts;
    if (d.kind === 'shot-row' && d.rowDrop) opts = { rowDrop: d.rowDrop };
    else if (d.isolated) opts = { isolated: true };
    try {
      moveElement(d.row, target, before, opts);
      if (d.operation) completeOperation(d.operation, 'Moved ' + (d.row.matches('.ev-section') ? 'section' : 'element'), 'success');
    } catch (err) {

    }
  }

  // Near the viewport's top/bottom edge the page auto-scrolls (SPEC §15).
  function autoScroll(y) {

  }

  // Innermost-section rule: the gap belongs to the innermost section under
  // the pointer. A pointer over a section's title header resolves to that
  // section itself (its h2 is inside it) → that section's own first gap.
  // Chrome is invisible to hit-testing the way the spec requires: the
  // toolbar and + section buttons resolve to no section; the pending
  // placeholder resolves to its owning section, and gaps are computed from
  // real items only, so the line appears around it as if it weren't there.
  // 0027: for a section drag, a pointer inside no section lands in the
  // nearest top-level band instead (leaves still never get a top-level
  // target), and the dragged section's own content tree yields no target.
  var REAL_ITEM_SELECTOR = '.ev-section, .ev-comment, .ev-code, .ev-property, .ev-file, .ev-url, .ev-screenshot';

  // ---------------------------------------------------------------------
  // 0055 (SPEC §15): spatially accurate screenshot drop targeting. Both
  // pointer coordinates and the rendered geometry (bounding boxes) drive
  // the destination, and the preview IS the move: the line's final
  // position is the destination, so a release performs exactly the
  // previewed operation — no target jump after the line lands.
  //   1. containment: a pointer over an existing row's box targets that
  //      row's own 2-D gaps — a pointer inside a row can reorder its
  //      images or join from another row without ever being extracted
  //      into the section body;
  //   2. otherwise the nearest body gap (the 0054 baseline nearest-gap
  //      model, over the body's direct items with rows as units): the gap
  //      JOINS a row only while the pointer is within SHOT_JOIN_ZONE_PX of
  //      the row's rendered box — the row above: at its end; the row
  //      below: at its start (before the first / after the last image);
  //      a pointer beyond the boundary is ISOLATED — a new single-image
  //      row at the gap (reachable at every gap touching no container and
  //      in the bands beyond the boundary: not all section whitespace
  //      joins the nearest row).
  // Ties: the earlier gap / row in document order; a gap within two rows'
  // zones (hand-edited adjacent rows — a normal run is one row) joins the
  // nearer row. Non-screenshot drags keep the baseline y-only model below,
  // including row-split for non-image drops.
  // ---------------------------------------------------------------------

  var SHOT_JOIN_ZONE_PX = 24; // the deterministic "adjacent" boundary (SPEC §15)

  // 0090: whole-row drags never enter a row's image-level gaps. A pointer
  // over a row chooses its before/after body boundary by the row midpoint;
  // elsewhere the normal direct-child body gaps place the wrapper intact.
  function shotRowGapForPoint(x, y) {
    var hit = typeof document.elementFromPoint === 'function'
      ? document.elementFromPoint(x, y) : null;
    var section = hit && hit.closest ? hit.closest('.ev-section') : null;
    if (!section) return null;
    var body = section.querySelector(':scope > .ev-body');
    if (!body) return null;

    var rows = [...body.querySelectorAll(':scope > .ev-shot-row')];
    for (var i = 0; i < rows.length; i++) {
      var row = rows[i];
      var box = row.getBoundingClientRect();
      if (x >= box.left && x <= box.right && y >= box.top && y <= box.bottom) {
        var midpoint = (box.top + box.bottom) / 2;
        var side = y < midpoint ? 'before' : 'after';
        var before = side === 'before' ? row : row.nextElementSibling;

          container: body,
          before: before && before.parentElement === body ? before : null,
          rowDrop: { row: row, side: side },

    var items = [...body.children].filter(function (el) {
      return el.matches(REAL_ITEM_SELECTOR + ', .ev-shot-row');
    });
    var before = nearestGapBefore(items, y);
    var previous = before ? before.previousElementSibling : body.lastElementChild;
    var row = before && before.matches('.ev-shot-row') ? before
      : previous && previous.matches('.ev-shot-row') ? previous : null;

      container: body,
      before: before,
      rowDrop: row ? { row: row, side: row === before ? 'before' : 'after' } : null,
    };
  }

  function shotGapForPoint(x, y) {
    var hit = typeof document.elementFromPoint === 'function'
      ? document.elementFromPoint(x, y) : null;
    var section = hit && hit.closest ? hit.closest('.ev-section') : null;
    if (!section) return null; // leaves never land at the top level
    var body = section.querySelector(':scope > .ev-body');
    if (!body) return null;

    // 1. containment: over an existing row's box → that row's own 2-D gaps
    var rows = [...body.querySelectorAll(':scope > .ev-shot-row')];
    for (var i = 0; i < rows.length; i++) {
      var box = rows[i].getBoundingClientRect();
      if (x >= box.left && x <= box.right && y >= box.top && y <= box.bottom) {

      }

    // pending placeholder (chrome) stays invisible to hit-testing

    });

  }

  // The row's own 2-D gaps (0055). The shots are grouped into wrapped
  // lines by VERTICAL OVERLAP — same-line flex items always overlap
  // vertically (top/center/bottom alignment alike); lines never do. Gap
  // anchors in document order: before the first line (a full-width line
  // above it); between two shots on one line, a VERTICAL segment at their
  // seam spanning the line's height; between two lines, a full-width line
  // in the row gap; after the last line (a full-width line below it).
  // The pointer takes the nearest anchor (perpendicular distance); an
  // exact tie goes to the earlier gap in document order.
  function inRowGap(row, x, y) {
    var shots = rowShots(row);
    if (shots.length === 0) return { container: row, before: null };
    var rects = shots.map(function (s) { return s.getBoundingClientRect(); });
    var lines = []; // { top, bottom } per wrapped line, in order
    var lineOf = []; // shot index → line index
    rects.forEach(function (r) {
      var last = lines[lines.length - 1];
      var sameLine = last && Math.max(last.top, r.top) < Math.min(last.bottom, r.bottom);
      if (!sameLine) lines.push({ top: r.top, bottom: r.bottom });
      else { last.top = Math.min(last.top, r.top); last.bottom = Math.max(last.bottom, r.bottom); }
      lineOf.push(lines.length - 1);
    });
    var anchors = [];
    for (var k = 0; k <= shots.length; k++) {
      if (k === 0) anchors.push({ kind: 'h', y: lines[0].top });
      else if (k === shots.length) anchors.push({ kind: 'h', y: lines[lines.length - 1].bottom });
      else if (lineOf[k] === lineOf[k - 1]) {
        anchors.push({ kind: 'v', x: (rects[k - 1].right + rects[k].left) / 2,
                       y0: lines[lineOf[k]].top, y1: lines[lineOf[k]].bottom });
      } else {
        anchors.push({ kind: 'h', y: (lines[lineOf[k] - 1].bottom + lines[lineOf[k]].top) / 2 });
      }
    }
    var best = 0;
    var bestDist = Infinity;
    for (var k2 = 0; k2 <= shots.length; k2++) {
      var a = anchors[k2];
      var d = a.kind === 'h'
        ? Math.abs(y - a.y)
        : (y >= a.y0 && y <= a.y1) ? Math.abs(x - a.x)
        : Math.hypot(x - a.x, y - (y < a.y0 ? a.y0 : a.y1)); // to the segment's nearer end
      if (d < bestDist) { bestDist = d; best = k2; }
    }
    return { container: row, before: shots[best] || null, vertical: anchors[best].kind === 'v' };
  }

  // The destination of a screenshot body gap (0055): join the row the gap
  // touches while the pointer is within the 24px boundary of the row's box
  // (the row above: at its end; the row below: at its start), else an
  // isolated new single-image row at the gap. The move seam is told via
  // opts.isolated, since a body gap touching a row would otherwise join it
  // under the 0054 baseline.
  function decideShotBodyGap(body, prev, next, y) {
    var prevRow = prev && prev.matches('.ev-shot-row') ? prev : null;
    var nextRow = next && next.matches('.ev-shot-row') ? next : null;
    var joinEnd = prevRow && distBelowBox(prevRow, y) <= SHOT_JOIN_ZONE_PX;
    var joinStart = nextRow && distAboveBox(nextRow, y) <= SHOT_JOIN_ZONE_PX;
    if (joinEnd && joinStart) {
      // a gap within both rows' zones (hand-edited adjacent rows only):
      // the nearer row wins; an exact tie → the earlier row in document order
      if (distAboveBox(nextRow, y) < distBelowBox(prevRow, y)) {
        return { container: nextRow, before: rowShots(nextRow)[0] || null };
      }
      return { container: prevRow, before: null };
    }
    if (joinEnd) return { container: prevRow, before: null };
    if (joinStart) return { container: nextRow, before: rowShots(nextRow)[0] || null };
    return { container: body, before: next, isolated: true };
  }

  function distBelowBox(el, y) { // pointer below the box: distance to its bottom edge
    var b = el.getBoundingClientRect().bottom;
    return y >= b ? y - b : 0;
  }

  function distAboveBox(el, y) { // pointer above the box: distance to its top edge
    var t = el.getBoundingClientRect().top;
    return y <= t ? t - y : 0;
  }

  function gapForPoint(x, y) {
    if (drag.kind === 'shot-row') return shotRowGapForPoint(x, y);
    // 0055: a screenshot drag is targeted spatially (2-D in-row gaps, the
    // 24px row-join boundary, isolated gaps); every other drag keeps the
    // baseline y-only nearest-gap model below.
    if (drag.row.matches('.ev-screenshot')) return shotGapForPoint(x, y);
    var isSectionDrag = drag.row.matches('.ev-section'); // 0027
    var hit = typeof document.elementFromPoint === 'function'

      if (isSectionDrag) {
        // 0027 cycle rule: the line never appears over the dragged
        // section itself or anywhere in its own content tree
        if (section === drag.row || drag.row.contains(section)) return null;
      }
      var body = section.querySelector(':scope > .ev-body');
      if (!body) return null;
      // 0051/0054 (SPEC §15/§23): rows are flattened into their member
      // shots — the nearest-gap rule applies to gaps INSIDE a row as well.
      // A gap before a shot that sits in a row resolves to the ROW as
      // container: the line lands there and a shot drop joins the row at
      // the gap (a non-image drop splits it).
      var items = [];
      [...body.children].forEach(function (el) {
        if (el.matches('.ev-shot-row')) {
          el.querySelectorAll(':scope > .ev-screenshot').forEach(function (s) { items.push(s); });
        } else if (el.matches(REAL_ITEM_SELECTOR)) {

        }

      var before = nearestGapBefore(items, y);
      if (before && before.parentElement && before.parentElement.matches('.ev-shot-row')) {

      }
      return { container: body, before: before };
    }

    // section button is invisible to hit-testing (it blocks nothing and
    // creates no gap); leaves never land at the top level (SPEC §15).
    if (!isSectionDrag) return null;
    var root = document.getElementById('evidence');
    if (!hit || !root.contains(hit)) return null; // toolbar/page background: no valid target

  // Each band between/around the top-level sections is one gap; the
  // pointer snaps to the nearest one, exactly as inside a body.

    return { container: root, before: nearestGapBefore(sections, y) };
  }

  // Always snaps — no dead zones. Gap boundaries: the first item's top,
  // each seam between items, the last item's bottom; the pointer takes the
  // nearest. An empty body is one drop zone (append).
  function nearestGapBefore(items, y) {
    if (items.length === 0) return null;
    var best = 0;
    var bestDist = Infinity;
    for (var i = 0; i <= items.length; i++) {
      var gy;
      if (i === 0) gy = items[0].getBoundingClientRect().top;
      else if (i === items.length) gy = items[items.length - 1].getBoundingClientRect().bottom;
      else gy = (items[i - 1].getBoundingClientRect().bottom + items[i].getBoundingClientRect().top) / 2;

      if (d < bestDist) { bestDist = d; best = i; }

    return items[best] || null;

  function positionDropLine(x, y) {

    // the line in the tree only — never in the document
    if (drag.kind === 'toc') {
      positionTocDropLine(x, y);
      return;
    }
    var gap = gapForPoint(x, y);
    if (!gap) {
      // over an area with no valid target: the line disappears (and a
      // release here would cancel)
      if (drag.line && drag.line.parentNode) drag.line.remove();
      drag.isolated = false;
      drag.rowDrop = null;
      return;
    }
    // 0055: the line marks the previewed destination — inside the
    // destination row at its insertion gap (a join; a start/end join shows
    // the row's own before-first / after-last line, so the container and
    // the position are both identified), or at the body gap where a new
    // single-image row will appear (an isolated drop). A side-by-side seam
    // renders the vertical segment.
    drag.line.classList.toggle('ev-drop-line-vertical', !!gap.vertical);
