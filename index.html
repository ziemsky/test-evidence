  // ---------------------------------------------------------------------
  // 0112/0113/0114 (SPEC §21): TOC entry drag nesting zones. The pure (layout-free)
  // heart of the feature: the pointer targets the ROW under it plus the
  // zone of that row it sits in — the row's right 33% is 'inside' (one
  // band, the row's whole height); the left 67% stacks 'before' (top half)
  // over 'after' (bottom half) — and the zone maps to a document
  // position:
  //   before → the document gap immediately before the row's section, in
  //            its own container (#evidence or the parent's .ev-body) —
  //            before it, at its depth;
  //   inside → the row's section's .ev-body, appended last — "become a
  //            subsection" of every section, childless ones included;
  //   after  → the row's section's own parent, immediately after the
  //            section (before its next sibling, or appended when the
  //            section is the parent's last child).
  // Cycle rule: every zone on a descendant row is a cycle (null); on the
  // dragged section's own row, 'before' and 'after' map to its current
  // position (a valid no-op — moveElement's in-place check) and 'inside'
  // is a cycle. The tree's end bands keep the 0111 meaning: above the
  // first row is 'before' the first entry (top-level position 1); below
  // the last row is 'after' the last TOP-LEVEL entry (after the last
  // top-level section — the last entry may be nested).
  // ---------------------------------------------------------------------

  function tocDropTarget(row, zone, draggedSection) {
    if (zone !== 'before' && zone !== 'after' && zone !== 'inside') return null;
    if (!(draggedSection && draggedSection.matches &&
        draggedSection.matches('.ev-section'))) return null;
    if (!row || !row.closest || row.closest('#toc-tree [data-action="toc-goto"]') !== row) return null;
    var root = document.getElementById('evidence');
    if (!root) return null;
    var section = tocSectionOfRow(row);
    if (!section) return null;
    // Cycle rule: a row inside the dragged section's own subtree is a
    // cycle in every zone — 'after' included, since its append slot sits
    // in the same (descendant) parent. The row for the dragged section
    // itself is its own current position for 'before'/'after' (a valid
    // no-op); contains() includes the node itself, so keep that case.
    if (draggedSection.contains(section) &&
        !(section === draggedSection && zone !== 'inside')) return null;
    var container = section.parentElement; // #evidence or the parent section's .ev-body
    if (container !== root && !(container && container.matches('.ev-body'))) return null;
    if (zone === 'before') return { container: container, before: section };
    if (zone === 'inside') {
      var body = section.querySelector(':scope > .ev-body');
      return { container: body, before: null };
    }
    return { container: container, before: section.nextElementSibling || null };
  }

  // 0113/0114: the zones are a horizontal cut first — the right 33% of the row
  // is the 'inside' band (the whole column, at any height) — and the left
  // 67% is then cut vertically in half into 'before' / 'after'.
  var TOC_ZONE_INSIDE_FRAC = 0.67; // x past 67% of the row's width → 'inside'
  var TOC_ZONE_SPLIT_FRAC = 0.5;   // the left 67% splits 50/50 before/after

  function tocSectionOfRow(row) {
    var root = document.getElementById('evidence');
    return root ? root.querySelectorAll('.ev-section')[Number(row.dataset.target)] : null;
  }

  // The drop surface is the tree only — over the pinned panel header, the
  // toolbar, the document, or anything else outside the tree there is no
  // target. The row under the pointer yields its zone from the pointer's
  // position within the row box: the right 33% band is 'inside' at any
  // height, the left 67% is 'before' above the row's mid-line and 'after'
  // below it; the pointer in the tree but off every row falls into the
  // end bands (the 0111 tree ends).
  function tocZoneForPoint(x, y) {
    var tree = document.getElementById('toc-tree');
    if (!tree) return null;
    var hit = typeof document.elementFromPoint === 'function'
      ? document.elementFromPoint(x, y) : null;
    if (!hit || !tree.contains(hit)) return null;
    var entries = [...tree.querySelectorAll('[data-action="toc-goto"]')];
    if (entries.length === 0) return null;
    var row = hit.closest ? hit.closest('[data-action="toc-goto"]') : null;
    if (!row) {
      // in the tree, over no row: the end bands
      var firstTop = entries[0].getBoundingClientRect().top;
      var lastBottom = entries[entries.length - 1].getBoundingClientRect().bottom;
      if (y < firstTop) return { row: entries[0], zone: 'before' }; // the top end
      if (y >= lastBottom) { // the bottom end: after the last TOP-LEVEL section
        var root = document.getElementById('evidence');
        var topRows = entries.filter(function (e) {
          var section = tocSectionOfRow(e);
          return section && section.parentElement === root;
        });
        var lastTopRow = topRows[topRows.length - 1];
        return lastTopRow ? { row: lastTopRow, zone: 'after' } : null;
      }
      for (var i = 0; i < entries.length; i++) {
        // over the tree's own chrome between rows: the next row's 'before'
        if (y < entries[i].getBoundingClientRect().bottom) return { row: entries[i], zone: 'before' };
      }
      return null;
    }
    var rect = row.getBoundingClientRect();
    var xFrac = rect.width > 0 ? (x - rect.left) / rect.width : 0.5;
    if (xFrac >= TOC_ZONE_INSIDE_FRAC) return { row: row, zone: 'inside' };
    var yFrac = rect.height > 0 ? (y - rect.top) / rect.height : 0.5;
    return { row: row, zone: yFrac < TOC_ZONE_SPLIT_FRAC ? 'before' : 'after' };
  }

  // The inside zone's wash: at most one washed row in the tree, both
  // marks (class + data-chrome) set and cleared together; the band itself
  // is CSS (the row's ::after, its right 33%).
  function setTocDropWash(row) {
    var tree = document.getElementById('toc-tree');
    if (!tree) return;
    var current = tree.querySelector('.toc-drop-wash');
    if (current === row) return;
    if (current) {
      current.classList.remove('toc-drop-wash');
      current.removeAttribute('data-chrome');
    }
    if (row) {
      row.classList.add('toc-drop-wash');
      row.setAttribute('data-chrome', '');
    }
  }

  // The chrome: at most one line and at most one washed row, both in
  // #toc-tree, both data-chrome, removed on drop or cancel. 'before' and
  // 'after' draw the line directly above / below the row at the row's own
  // indent (the 0111 look); 'inside' draws it below the row at the child
  // indent (+1em) and washes the row, so "dropping into this section"
  // reads unambiguously even when the section is childless. The mapped
  // document position is stored on the drag so the release performs it;
  // the document itself is never touched. The 'inside' zone is the row's
  // right-hand band, so the wash is that band (CSS); the line still marks
  // the DESTINATION — the child slot sits below the row at +1em, where the
  // new entry will render.
  function positionTocDropLine(x, y) {
    var zone = tocZoneForPoint(x, y);
    var target = zone ? tocDropTarget(zone.row, zone.zone, drag.row) : null;
    if (!target) {
      // over a cycle row/zone (or outside the tree): no line, no wash —
      // and a release there would cancel
      if (drag.line && drag.line.parentNode) drag.line.remove();
      setTocDropWash(null);
      drag.tocTarget = null;
      return;
    }
    drag.tocTarget = target;
    var tree = document.getElementById('toc-tree');
    if (!tree) return; // the panel cannot disappear mid-drag; guard anyway
    setTocDropWash(zone.zone === 'inside' ? zone.row : null);
    // the row's own indent is (depth − 1)em at the ENTRY's font (the tree
    // button's 0.85em); the child level is +1em. Mirror the row's used
    // font-size onto the line so its em units line up with the entry
    // indents, and reset both for the non-inside zones.
    if (zone.zone === 'inside') {
      drag.line.style.fontSize = window.getComputedStyle(zone.row).fontSize;
      drag.line.style.marginLeft = ((parseFloat(zone.row.style.paddingLeft) || 0) + 1) + 'em';
    } else {
      drag.line.style.fontSize = '';
      drag.line.style.marginLeft = '';
    }
    if (zone.zone === 'before') tree.insertBefore(drag.line, zone.row);
    else tree.insertBefore(drag.line, zone.row.nextSibling); // 'after' and 'inside'
  }

  // 0111 (SPEC §21): while the pointer is within ~40px of the top or
  // bottom edge of the tree's own scrollport, the panel auto-scrolls
  // ~12px per tick (the §15 constants); the page scroll is untouched, and
  // a pointer over the document (outside the panel) scrolls nothing.
  function autoScrollTocTree(x, y) {
    var panel = document.getElementById('toc-panel');
    if (!panel) return;
    var rect = panel.getBoundingClientRect();
    if (x < rect.left || x > rect.right) return;
    if (y >= rect.top && y < rect.top + AUTO_SCROLL_EDGE_PX) panel.scrollTop -= AUTO_SCROLL_STEP_PX;
    else if (y > rect.bottom - AUTO_SCROLL_EDGE_PX && y <= rect.bottom) panel.scrollTop += AUTO_SCROLL_STEP_PX;
  }

  // ---------------------------------------------------------------------
  // Handlers (all delegated on document, SPEC §3)
  // ---------------------------------------------------------------------

  // 0015: content growth

  function addSection(parent) {
    var section = makeSection('');
    parent.appendChild(section);
    renumber();
    alignProps(); // 0036 (§18)
    focusTextFieldAtEnd(section.querySelector(':scope > .ev-title > .ev-title-text'));
    return section;
  }

  // 0042 (SPEC §20): entry click → confirm() with the locked wording →
  // the wholesale apply. One code path — confirmed in every case,
  // including an empty document (no empty special case).
  function applyExampleFlow(entryBtn, operation) {
    var example = EXAMPLES.find(function (ex) { return ex.id === entryBtn.dataset.example; });
    if (!example) return;
    setExampleMenu(false); // entry click closes the dropdown
    var message =
      'Replace this document with the "' + example.label + '" example? '
      + 'The previous content will be unrecoverably lost, including its saved asset files.';
    if (!confirm(message)) {
      setExampleMenu(false); // the confirmation resolved: nothing else happens
      return false;
    }
    setExampleMenu(false); // the confirmation resolved
    return applyExample(example, operation);
  }

  // 0042 (SPEC §20): build an example's document as NORMAL content — the
  // app's own element helpers, so real editables and rows; §5.3 strips
  // contenteditable on save as usual.
  function buildExampleDocument(def) {
    var screenshotRefs = [];
    function appendUrlItem(body, definition) {
      var urlRow = makeUrlRow();
      var inputs = urlEditorInputs(urlRow);
      inputs.url.value = definition.url;
      inputs.text.value = definition.text;
      finishUrlEditing(urlRow);
      body.appendChild(urlRow);
    }
    // Ordered body items: one entry per row, in authored order. Examples use
    // this where they need adjacencies the convenience fields cannot
    // express (their order is fixed: comments, code, properties, then
    // files, urls, and the screenshot row last). Item keys: comment
    // (string), code (string), property ([key, value]), file (name),
    // url ({ url, text }), screenshots (array of shot definitions — one
    // shot row at the item's position).
    function appendScreenshotRow(body, shots) {
      var row = makeShotRow();
      shots.forEach(function (shot) {
        var item = makeScreenshot(shot.caption, shot.size || 'medium');
        if (shot.standalone) item.setAttribute('data-standalone', '');
        var img = item.querySelector(':scope > img.ev-img');
        screenshotRefs.push({ image: img, asset: shot.asset });
        row.appendChild(item);
      });
      body.appendChild(row);
    }
    function appendBodyItem(body, item) {
      if (item.comment != null) {
        body.appendChild(makeComment(item.comment));
      } else if (item.code != null) {
        body.appendChild(makeCode(item.code));
      } else if (item.property) {
        body.appendChild(makeProperty(item.property[0], item.property[1]));
      } else if (item.file != null) {
        body.appendChild(makeFile(item.file));
      } else if (item.url) {
        appendUrlItem(body, item.url);
      } else if (item.screenshots && item.screenshots.length) {
        appendScreenshotRow(body, item.screenshots);
      }
    }
    function buildSection(node) {
      var section = makeSection(node.title != null ? node.title : '');
      var body = section.querySelector(':scope > .ev-body');
      if (node.body) {
        node.body.forEach(function (item) { appendBodyItem(body, item); });
      } else {
        (node.comments || []).forEach(function (text) {
          body.appendChild(makeComment(text));
        });
        if (node.code != null) body.appendChild(makeCode(node.code));
        (node.properties || []).forEach(function (pair) {
          body.appendChild(makeProperty(pair[0], pair[1]));
        });
      }
      (node.sections || []).forEach(function (sub) {
        body.appendChild(buildSection(sub));
      });
      if (node.fileLeadIn) body.appendChild(makeComment(node.fileLeadIn));
      (node.files || []).forEach(function (file) {
        body.appendChild(makeFile(file.name));
      });
      (node.urls || []).forEach(function (definition) {
        appendUrlItem(body, definition);
      });
      var screenshots = node.screenshots || (node.screenshot ? [{
        asset: null,
        caption: node.screenshotCaption,
        size: 'medium',
      }] : []);
      if (screenshots.length) appendScreenshotRow(body, screenshots);
      return section;
    }
    return { sections: (def.sections || []).map(buildSection), screenshotRefs: screenshotRefs };
  }

  function exampleAssetDefinitions(example) {
    return example.assets || [{ name: example.asset, svgId: 'example-shot-svg' }];
  }

  function exampleAssetSource(definition) {
    if (definition.svgId) {
      var svg = document.getElementById(definition.svgId);
      return svg ? svg.outerHTML : '';
    }
    return definition.content != null ? definition.content : '';
  }

  // 0062: every physical asset name the document references — screenshot
  // srcs as stored, plus file rows by their persisted (encoded) asset URL
  // with the disk name decoded. Deduplicated: a shared asset may be
  // referenced by several rows (cross-type included), and it is one file.
  function referencedAssetNames(root) {
    var names = [];
    root.querySelectorAll('img[src^="assets/"]').forEach(function (img) {
      var src = img.getAttribute('src') || '';
      names.push(src.slice(src.lastIndexOf('/') + 1));
    });
    root.querySelectorAll('.ev-file > a[href^="assets/"]').forEach(function (link) {
      var href = link.getAttribute('href') || '';
      var encoded = href.slice(href.lastIndexOf('/') + 1);
      try {
        names.push(decodeURIComponent(encoded));
      } catch (e) {
        names.push(encoded); // a malformed percent-sequence: the raw name is the best fallback
      }
    });
    var seen = new Set();
    var unique = [];
    names.forEach(function (name) {
      if (!seen.has(name)) { seen.add(name); unique.push(name); }
    });
    return unique;
  }

  // 0042/0062 (SPEC §20): the wholesale apply. Content replacement never
  // fails on FS — file work degrades per the FS-degradation rules
  // (fallback / no handle yet → inline data-URL, no picker, no prompt;
  // permission declined → inline result; a missing old asset is
  // ignored; any other per-asset delete failure is reported and does not
  // undo the replacement). No save is triggered.
  async function applyExample(example, operation) {
    var root = document.getElementById('evidence');
    clearElementClipboardState(); // document replacement clears transient clipboard state
    // 1: the old asset files to delete — screenshots AND file attachments,
    // discovered before the replacement so the old rows cannot vanish
    // first (the example's own asset is not old — a second apply overwrites
    // it rather than deleting it first)
    var exampleAssets = exampleAssetDefinitions(example);
    var exampleAssetNames = new Set(exampleAssets.map(function (asset) { return asset.name; }));
    var oldNames = referencedAssetNames(root).filter(function (name) {
      return !exampleAssetNames.has(name);
    });
    // 2: wholesale content replacement — the title text, every section,
    // and a pending screenshot placeholder (if any)
    var title = root.querySelector(':scope > h1.ev-doc-title > .ev-doc-title-text');
    title.textContent = example.document.title;
    root.querySelectorAll(':scope > .ev-section').forEach(function (section) { section.remove(); });
    var pending = root.querySelector('.ev-screenshot-pending');
    if (pending) pending.remove();
    var built = buildExampleDocument(example.document);
    built.sections.forEach(function (section) { root.appendChild(section); });
    // 3: store the example's authored assets. SVG screenshots are serialized
    // raw, never rasterized; text assets retain their exact authored bytes.
    var inlineSources = new Map();
    exampleAssets.forEach(function (definition) {
      var source = exampleAssetSource(definition);
      if (definition.svgId) inlineSources.set(definition.name, 'data:image/svg+xml,' + encodeURIComponent(source));
    });
    var storedOnDisk = new Set();
    var fileWorkFailure = null;
    if (mode === 'primary' && dirHandle) {
      // apply triggers no folder picker: only the ensurePermission() guard.
      // A broken handle degrades like a declined one — the content
      // replacement never fails on FS.
      var granted;
      try {
        granted = await ensurePermission();
      } catch (e) {
        granted = false;
      }
      if (granted) {
        try {
          if (!assetsDir) assetsDir = await dirHandle.getDirectoryHandle('assets', { create: true });
          for (var a = 0; a < exampleAssets.length; a++) {
            var definition = exampleAssets[a];
            try {
              var fh = await assetsDir.getFileHandle(definition.name, { create: true });
              var writable = await fh.createWritable();
              await writable.write(exampleAssetSource(definition));
              await writable.close(); // overwrite: repeated applies reuse the same names
              storedOnDisk.add(definition.name);
            } catch (writeError) {
              if (!fileWorkFailure) fileWorkFailure = 'could not write ' + definition.name;
            }
          }
          // Do not remove old evidence if the replacement asset set was only
          // partially written; the content replacement itself still stands.
          if (storedOnDisk.size === exampleAssets.length) {
            for (var i = 0; i < oldNames.length; i++) {
              try {
                await assetsDir.removeEntry(oldNames[i]);
              } catch (e) {
                if (e && e.name === 'NotFoundError') continue; // a missing old asset is ignored
                if (!fileWorkFailure) fileWorkFailure = 'could not delete ' + oldNames[i];
              }
            }
          }
        } catch (err) {
          fileWorkFailure = fileWorkFailure || (err && err.message ? err.message : String(err));
        }
      } else {
        fileWorkFailure = 'permission not granted';
      }
    }
    built.screenshotRefs.forEach(function (ref) {
      if (storedOnDisk.has(ref.asset)) ref.image.src = 'assets/' + ref.asset;
      else ref.image.src = inlineSources.get(ref.asset) || '';
    });
    // 4: bookkeeping — re-seed the used names from the NEW document, re-render
    // chrome (control rows, numbering, key alignment, + section button),
    // sync the tab title and focus the title field.
    seedUsedNames();
    refreshChrome();
    syncTabTitle();
    if (fileWorkFailure) completeOperation(operation, 'Example file work failed — ' + fileWorkFailure, 'warning');
    else completeOperation(operation, 'Example applied', 'success');
    focusTextFieldAtEnd(title);
  }

  // 0017: delete & section-delete confirmation (SPEC §10)

  function sectionDeleteMessage(section) {
    var titleEl = section.querySelector(':scope > h2.ev-title > .ev-title-text');
    var numEl = section.querySelector(':scope > h2.ev-title > .ev-num');
    var title = titleEl ? titleEl.textContent.trim() : '';
    if (!title) return 'Delete this untitled section and all of its contents?';
    var num = numEl ? numEl.textContent : '';
    return 'Delete section "' + (num ? num + ' ' : '') + title + '" and all of its contents?';
  }

  function deleteElement(actionBtn, operation) {
    var controls = actionBtn.closest('.ev-controls');
    var target = controls ? controls.parentElement : null;
    if (controls && controls.hasAttribute('data-section-palette')) {
      var paletteTarget = paletteOwnerTarget();
      if (!paletteTarget) return;
      if (paletteTarget.matches('.ev-section') && !confirm(sectionDeleteMessage(paletteTarget))) return false;
      if (paletteTarget.matches('.ev-file')) {
        return deleteFileRow(actionBtn, operation);
      }
      if (paletteTarget.matches('.ev-url') && !confirm('Delete this URL row?')) return false;
      var screenshotRow = paletteTarget.matches('.ev-screenshot')
        ? paletteTarget.parentElement : null;
      paletteTarget.remove();
      if (screenshotRow && screenshotRow.matches('.ev-shot-row') &&
          !screenshotRow.querySelector(':scope > .ev-screenshot')) {
        screenshotRow.remove();
      }
      paletteOwnerSection = null;
      paletteOwnerRow = null;
      paletteFocusTarget = null;
      paletteAnchor = null;
      refreshPaletteMarker();
      renumber();
      alignProps();
      renderEndAddToolbox();
      return;
    }
    if (!target) return;
    if (target.matches('h2.ev-title')) {
      var section = target.closest('.ev-section');
      if (!confirm(sectionDeleteMessage(section))) return false; // declined: leave untouched
      section.remove();
    } else if (target.matches('.ev-file')) {
      return deleteFileRow(actionBtn, operation); // 0061: confirmed; the physical asset goes first
    } else {
      // leaves (comment, property; screenshots once 0021 lands): instant, no confirmation
      var row = target.parentElement; // 0051 (§23.5): captured before the remove
      target.remove();
      // a row that loses its last shot is discarded, alignment state included
      if (row && row.matches && row.matches('.ev-shot-row') &&
          !row.querySelector(':scope > .ev-screenshot')) {
        row.remove();
      }
    }
    renumber(); // after any delete (SPEC §10); delete never triggers a save
    alignProps(); // 0036 (§18): deleting the widest key narrows the column
    renderEndAddToolbox(); // 0115: the toolbox tracks the live top-level list
  }

  // 0061: file-row deletion. The persisted encoded relative asset URL is
  // authoritative for asset identity and reference matching; the displayed
  // filename is presentation only (it drives the copy text and the
  // confirmation wording).

  // Every authored evidence item referencing that exact asset path — file
  // rows and screenshots alike (the shared namespace makes a cross-type
  // collision possible, and both count).
  function fileRefsFor(assetPath) {
    var refs = [];
    document.querySelectorAll('#evidence .ev-file > a').forEach(function (link) {
      if (link.getAttribute('href') === assetPath) refs.push(link.closest('.ev-file'));
    });
    document.querySelectorAll('#evidence .ev-screenshot > img.ev-img').forEach(function (img) {
      if (img.getAttribute('src') === assetPath) refs.push(img.closest('.ev-screenshot'));
    });
    return refs;
  }

  // Remove one referencing evidence item; a screenshot row that loses its
  // last shot is discarded, alignment state included (the existing row
  // invariant, 0051 §23 mutation mechanics 5).
  function removeFileRef(ref) {
    if (ref.matches('.ev-screenshot')) {
      var row = ref.parentElement; // captured before the remove
      ref.remove();
      if (row && row.matches('.ev-shot-row') &&
          !row.querySelector(':scope > .ev-screenshot')) {
        row.remove();
      }
    } else {
      ref.remove();
    }
  }

  async function deleteFileRow(actionBtn, operation) {
    var row = rowForAction(actionBtn);
    var link = row ? row.querySelector(':scope > a') : null;
    if (!link) return;
    var assetPath = link.getAttribute('href') || ''; // the encoded URL is authoritative
    var refs = fileRefsFor(assetPath);
    var filename = link.textContent; // display text: presentation only
    var message = refs.length === 1
      ? 'Delete file "' + filename + '" from this evidence and from assets?'
      : 'Delete file "' + filename + '" from assets and remove all ' + refs.length + ' references from this evidence?';
    if (!confirm(message)) return false; // declining changes nothing
    // The physical asset goes first; the references follow only after a
    // successful deletion. A missing asset counts as success — the
    // requested final state already holds. Any other permission or
    // deletion failure retains every reference and reports the failure.
    if (!(await ensurePermission())) {
      completeOperation(operation, 'File not deleted — permission not granted', 'error');
      return;
    }
    try {
      var dir = assetsDir;
      if (!dir) {
        // No create: an assets/ directory missing on disk means the asset
        // is missing too — success below, with no empty directory created
        // as a side effect of a no-op deletion.
        try {
          dir = await dirHandle.getDirectoryHandle('assets');
        } catch (err) {
          if (!err || err.name !== 'NotFoundError') throw err;
          dir = null;
        }
      }
      if (dir) {
        try {
          // the disk name is the decoded filename (the href carries it encoded)
          await dir.removeEntry(decodeURIComponent(assetPath.slice(assetPath.lastIndexOf('/') + 1)));
        } catch (err) {
          if (!err || err.name !== 'NotFoundError') throw err;
        }
        assetsDir = dir;
      }
    } catch (err) {
      completeOperation(operation, 'File not deleted — ' + (err && err.message ? err.message : String(err)), 'error');
      return;
    }
    refs.forEach(removeFileRef);
    renumber(); // after any delete; deletion never triggers a save
    alignProps();
    renderEndAddToolbox();
    completeOperation(operation, 'File deleted: ' + filename, 'success');
  }

  // 0066 (SPEC §27): rename a row's asset on disk. The gesture order is the
  // §10 file-delete chain mold: prompt() first, then ensurePermission().
  // The File-System-Access API has no rename primitive: the bytes are
  // written to the new name FIRST, then removeEntry deletes the old one
  // (delete-first is forbidden — data-loss risk). A missing old file counts
  // as success; a failed delete orphans the old file, the rename STANDS
  // (references are updated), and the operation log reports the failed step.
  // Every row referencing the exact old path follows the rename.

  // A valid assets/ name: non-empty, no path separators, no control
  // characters (C0 + C1 + DEL — checked on the trimmed input).
  function validAssetName(name) {
    return name.length > 0 && !/[\\/\u0000-\u001f\u007f-\u009f]/.test(name);
  }

  // Every row referencing the exact old path updates in place: file-row
  // href (re-encoded) and link text, screenshot img[src], cross-type and
  // shared-path rows included; the §26 label follows its image.
  function applyRenameReferences(oldPath, newName) {
    var newPath = 'assets/' + encodeURIComponent(newName);
    fileRefsFor(oldPath).forEach(function (ref) {
      if (ref.matches('.ev-file')) {
        var link = ref.querySelector(':scope > a');
        link.setAttribute('href', newPath);
        link.textContent = newName;
      } else {
        var image = ref.querySelector(':scope > img.ev-img');
        image.setAttribute('src', newPath);
        ensureFilenameLabel(ref, image); // 0063 (§26): the label refreshes
      }
    });
  }

  async function renameFile(actionBtn, operation) {
    var row = rowForAction(actionBtn) || actionBtn.closest('.ev-screenshot');
    if (!row) return;
    var link = row.matches('.ev-file') ? row.querySelector(':scope > a') : null;
    var image = link ? null : row.querySelector(':scope > img.ev-img');
    var reference = link || image;
    if (!reference) return;
    var oldPath = reference.getAttribute(link ? 'href' : 'src') || '';
    if (oldPath.indexOf('assets/') !== 0) return; // data-URL: no name, no rename
    var oldName = decodeURIComponent(oldPath.slice(oldPath.lastIndexOf('/') + 1));
    var entered = prompt('Rename "' + oldName + '" to:', oldName);
    if (entered === null) return false; // cancel/Escape/✕: a silent no-op
    var newName = entered.trim(); // trimmed before any check
    if (!validAssetName(newName)) {
      completeOperation(operation, 'Rename failed — "' + newName + '" is not a valid filename', 'error');
      return;
    }
    if (newName.toLowerCase() === oldName.toLowerCase()) return false; // same name: no-op
    if (!(await ensurePermission())) {
      completeOperation(operation, 'Rename failed — permission not granted', 'error');
      return;
    }
    var dir = assetsDir;
    var deleteError = null;
    try {
      if (!dir) {
        try {
          dir = await dirHandle.getDirectoryHandle('assets');
        } catch (err) {
          if (!err || err.name !== 'NotFoundError') throw err;
          dir = null; // no assets/ yet: the old file is missing — success below
        }
      }
      // The collision check: enumerate the REAL assets/ directory and
      // compare case-insensitively. The disk is the single truth — the
      // in-document used-names set plays no part, and a name on disk that
      // no row references still collides. A missing directory holds no
      // names, so no collision is possible.
      if (dir) {
        var existing = [];
        for await (var entry of dir.entries()) existing.push(entry[0]);
        for (var i = 0; i < existing.length; i++) {
          if (existing[i].toLowerCase() === newName.toLowerCase()) {
            completeOperation(operation, 'Rename failed — "' + newName + '" already exists', 'error');
            return;
          }
        }
      }
      var bytes = null;
      if (dir) {
        try {
          bytes = await (await dir.getFileHandle(oldName)).getFile();
        } catch (err) {
          if (!err || err.name !== 'NotFoundError') throw err; // missing old = success
        }
      }
      if (bytes) {
        // write the bytes to the new name first, then delete the old one
        var target = await dir.getFileHandle(newName, { create: true });
        var writable = await target.createWritable();
        await writable.write(bytes);
        await writable.close();
        try {
          await dir.removeEntry(oldName);
        } catch (err) {
          if (!err || err.name !== 'NotFoundError') deleteError = err; // rename stands
        }
        assetsDir = dir;
      }
    } catch (err) {
      // the write failed: nothing was renamed, every reference stays
      completeOperation(operation, 'Rename failed — ' + (err && err.message ? err.message : String(err)), 'error');
      return;
    }
    applyRenameReferences(oldPath, newName); // every reference follows the rename
    seedUsedNames(); // the used-image-names set refreshes with the rename
    if (deleteError) {
      completeOperation(operation, 'Rename failed — ' + (deleteError.message ? deleteError.message : String(deleteError)), 'warning');
    } else {
      completeOperation(operation, 'Renamed ' + formatTime(new Date()), 'success');
    }
    // no save is triggered — a later Save serializes the new src/href
  }

  // 0019: copy text fields (SPEC §9)

  // 0022: screenshot copy — PNG bytes on the clipboard (SPEC §9). All stored
  // images are already PNG (0021), so copy never re-encodes.

  // Every data-URL this app stores comes from FileReader.readAsDataURL —
  // always base64, always PNG (0021) — and Chromium's clipboard accepts
  // image/png only, so the decode is base64-only.
  function dataUrlToBlob(dataUrl) {
    var binary = atob(dataUrl.slice(dataUrl.indexOf(',') + 1));
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return new Blob([bytes], { type: 'image/png' });
  }

  // Read an on-disk image back through the stored handles (SPEC §9).
  // ensurePermission() is the single guard over every FS operation (SPEC
  // §5.1): if 'granted' cannot be obtained within the click gesture the
  // copy is a no-op with a completion log — an assets/ image has no inline
  // bytes to fall back to.
  async function readScreenshotViaHandles(src) {
    if (!(await ensurePermission())) throw new Error('permission not granted');
    if (!assetsDir) assetsDir = await dirHandle.getDirectoryHandle('assets', { create: true });
    var fh = await assetsDir.getFileHandle(src.slice('assets/'.length));
    return fh.getFile();
  }

  function copyScreenshot(actionBtn, operation) {
    var screenshot = actionBtn.closest('.ev-screenshot') || rowForAction(actionBtn);
    var img = screenshot ? screenshot.querySelector(':scope > img.ev-img') : null;
    if (!img) return;
    var src = img.getAttribute('src') || '';
    // 0042 (SPEC §20, §9): the example's SVG screenshot (detected by its
    // asset name / .svg src, stored on-disk or as a data-URL). Chromium's
    // clipboard image write is PNG-only, so the copy is a no-op with a
    // locked completion log.
    if (src.slice(-4) === '.svg' || src.indexOf('data:image/svg+xml') === 0) {
      completeOperation(operation, 'Copy unavailable — example screenshot', 'information');
      return;
    }
    // Called from the click gesture (SPEC §9); every failure surfaces in the
    // operation log instead of re-encoding or dropping the bytes.
    return Promise.resolve()
      .then(function () {
        return src.indexOf('assets/') === 0
          ? readScreenshotViaHandles(src)
          : dataUrlToBlob(src);
      })
      .then(function (blob) {
        return navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
      })
      .then(
        function () { completeOperation(operation, 'Copied ' + formatTime(new Date()), 'success'); },
        function (err) { completeOperation(operation, 'Copy failed — ' + (err && err.message ? err.message : String(err)), 'error'); },
      );
  }

  // 0071: section clipboard snapshots contain only document data. Controls,
  // handles, numbering, depth markers, and other chrome are recreated by the
  // existing factories when a paste is performed.
  function snapshotScreenshot(item) {
    var image = item.querySelector(':scope > img.ev-img');
    var caption = item.querySelector(':scope > .ev-caption');
    return {
      src: image ? image.getAttribute('src') || '' : '',
      alt: image ? image.getAttribute('alt') || '' : '',
      caption: caption ? caption.textContent : '',
      size: item.getAttribute('data-size'),
      width: item.getAttribute('data-width'),
      standalone: item.hasAttribute('data-standalone'),
      imageWidth: image ? image.style.width : '',
    };
  }

  function snapshotUrl(row) {
    var link = row.querySelector(':scope > .ev-url-link');
    return {
      type: 'url',
      url: link ? link.getAttribute('href') || '' : '',
      text: row.getAttribute('data-text') || '',
    };
  }

  function urlFromSnapshot(snapshot) {
    var row = makeUrlRow();
    var inputs = urlEditorInputs(row);
    inputs.url.value = snapshot.url;
    inputs.text.value = snapshot.text;
    finishUrlEditing(row);
    return row;
  }

  function snapshotSectionChild(child) {
    if (child.matches('.ev-section')) return snapshotSection(child);
    if (child.matches('.ev-url')) return snapshotUrl(child);
    if (child.matches('.ev-comment')) {
      return {
        type: 'comment',
        text: child.querySelector(':scope > .ev-comment-text').textContent,
      };
    }
    if (child.matches('.ev-code')) {
      return {
        type: 'code',
        text: child.querySelector(':scope > .ev-code-text').textContent,
        softWrap: child.hasAttribute('data-soft-wrap'),
      };
    }
    if (child.matches('.ev-property')) {
      return {
        type: 'property',
        key: child.querySelector(':scope > .ev-prop-key').textContent,
        value: child.querySelector(':scope > .ev-prop-value').textContent,
      };
    }
    if (child.matches('.ev-file')) {
      var link = child.querySelector(':scope > a');
      return {
        type: 'file',
        href: link ? link.getAttribute('href') || '' : '',
        text: link ? link.textContent : '',
      };
    }
    if (child.matches('.ev-shot-row')) {
      return {
        type: 'shot-row',
        valign: child.getAttribute('data-valign'),
        halign: child.getAttribute('data-halign'),
        screenshots: [...child.querySelectorAll(':scope > .ev-screenshot')]
          .map(snapshotScreenshot),
      };
    }
    if (child.matches('.ev-screenshot')) {
      return { type: 'screenshot', screenshot: snapshotScreenshot(child) };
    }
    return null;
  }

  function snapshotSection(section) {

      'size-larger': 'Resize screenshot', 'size-smaller': 'Resize screenshot',
      print: 'Print',
    };
    return labels[action] ? { name: labels[action], message: labels[action] + ' completed' } : null;
  }

  function onDocumentClick(event) {
    var operation = operationForClick(event);
    if (!operation) return dispatchDocumentClick(event);
    return runOperation(operation.name, operation.message, function (active) {
      return dispatchDocumentClick(event, active);
    });
  }

  function dispatchDocumentClick(event, operation) {
    var editingUrlRow = document.querySelector('#evidence .ev-url[data-editing]');
    if (editingUrlRow && !editingUrlRow.contains(event.target)) finishUrlEditing(editingUrlRow);
    var palette = sharedSectionPalette();
    var owner = paletteOwnerTarget();
    if (owner && palette && !palette.contains(event.target) && !owner.contains(event.target)) {
      closeSectionPalette();
    }
    // 0042 (SPEC §20): a click outside the button and the menu closes the
    // dropdown; the click itself still runs (toggle, entry, save, …).
    if (exampleMenuOpen) {
      var clickTarget = event.target;
      if (!(clickTarget.closest && (clickTarget.closest('#example-menu') || clickTarget.closest('#example-btn')))) {
        setExampleMenu(false);
      }
    }
    var saveBtn = event.target.closest('#save-btn');
    if (saveBtn) {
      return save(operation);
      return;
    }
    var actionBtn = event.target.closest('[data-action]');
    if (!actionBtn) return;
    var actionPalette = actionBtn.closest('[data-section-palette]');
    if (actionPalette && actionPalette.hasAttribute('data-palette-inert')) return;
    var action = actionBtn.dataset.action;
    if (action === 'toggle-example-menu') {
      setExampleMenu(!exampleMenuOpen); // mouse-only toggle
      return;
    }
    if (action === 'print') {
      window.print();
      return;
    }
    if (action === 'toggle-theme') {
      toggleThemeAppearance();
      return;
    }
    if (action === 'toggle-help') {
      var helpOpen = document.body.classList.toggle('help-open');
      if (helpOpen) {
        var tocMaximum = panelResizeLimits('toc').max;
        if (tocExpandedWidth > tocMaximum) setPanelResizeWidth('toc', tocMaximum);
        if (helpPanelWidth !== null) setPanelResizeWidth('help', helpPanelWidth);
      }
      refreshPanelResizeValues();
      actionBtn.textContent = helpOpen ? 'x' : '?';
      actionBtn.setAttribute('aria-expanded', String(helpOpen));
      actionBtn.setAttribute('aria-label', helpOpen ? 'Close help' : 'Open help');
      actionBtn.setAttribute('title', helpOpen ? 'Close help' : 'Open help');
      var helpPanel = document.getElementById('help-panel');
      if (helpPanel) helpPanel.setAttribute('aria-hidden', String(!helpOpen));
      return;
    }
    if (action === 'apply-example') {
      return applyExampleFlow(actionBtn, operation); // §20: confirm → apply
    }
    if (action === 'toggle-toc') {
      // 0044 (SPEC §21): flip the state and nothing else — the width and
      // padding animation is CSS on the body class. No other close paths
      // (no Esc, no click-outside).
      document.body.classList.toggle('toc-collapsed');
      if (!document.body.classList.contains('toc-collapsed')) {
        var expandedMaximum = panelResizeLimits('toc').max;
        if (tocExpandedWidth > expandedMaximum) setPanelResizeWidth('toc', expandedMaximum);
      }
      if (helpPanelWidth !== null) setPanelResizeWidth('help', helpPanelWidth);
      refreshPanelResizeValues();
      actionBtn.setAttribute(
        'aria-expanded',
        document.body.classList.contains('toc-collapsed') ? 'false' : 'true',
      );
      return;
    }
    if (action === 'toc-goto') {
      // 0111 (SPEC §21): a completed (or cancelled) drag suppresses the
      // entry's click — a real drag never navigates; a ≤4px click still does
      if (tocDragClickSuppressed) {
        clearTocDragClickSuppression();
        return;
      }
      // 0044 (SPEC §21): scroll only — no focus change into the document,
      // no panel-state change, no save. data-target is the entry's index
      // into the live section list (set at render time).
      var tocSections = [...document.querySelectorAll('#evidence .ev-section')];
      var tocTarget = tocSections[Number(actionBtn.dataset.target)];
      if (tocTarget) tocTarget.scrollIntoView({ behavior: 'smooth' });
      return;
    }
    if (action === 'add-section') {
      // 0115: the global toolbox's section action always appends a top-level
      // section immediately before the toolbox. Legacy buttons (if any) keep
      // their old insert-after behavior during an in-session upgrade.
      var newSection = makeSection('');
      var addToolbox = actionBtn.closest('[data-add-toolbox]');
      if (addToolbox) addToolbox.parentElement.insertBefore(newSection, addToolbox);
      else actionBtn.insertAdjacentElement('afterend', newSection);
      renumber();
      alignProps(); // 0036 (§18)
      renderEndAddToolbox();
      focusTextFieldAtEnd(newSection.querySelector(':scope > .ev-title > .ev-title-text'));
      return;
    }
    if (action === 'add-section-after') {
      // 0028: the button lives in the clicked section's own title row, so
      // the nearest ancestor section IS the clicked one — insert a new
      // sibling immediately after it (same depth, positional), re-render
      // chrome (renumber + + section buttons), and focus the empty title.
      var clicked = sectionForAction(actionBtn);
      if (!clicked) return;
      var newSection = makeSection('');
      clicked.insertAdjacentElement('afterend', newSection);
      refreshChrome();
      focusTextFieldAtEnd(newSection.querySelector(':scope > .ev-title > .ev-title-text'));
      return;
    }
    if (/^row-(valign|halign)-/.test(action)) {
      // 0051 (SPEC §23): the stateful row-alignment toggles — set the
      // wrapper's attribute (omitted at the top/center defaults) and re-render
      // the strip's highlight; reflow is pure CSS, no save is triggered.
      var shotRow = shotRowForAction(actionBtn);
      if (shotRow) {
        var attr = 'data-' + action.match(/^row-(valign|halign)-/)[1];
        var value = action.slice(action.lastIndexOf('-') + 1);
        if (value === (attr === 'data-valign' ? 'top' : 'center')) shotRow.removeAttribute(attr);
        else shotRow.setAttribute(attr, value);
        var oldStrip = shotRow.querySelector(':scope > .ev-row-controls');
        if (oldStrip) oldStrip.replaceWith(makeRowControls(shotRow));
        refreshSharedPaletteState(shotRow, sharedSectionPalette());
      }
      return;
    }
    var addToolbox = actionBtn.closest('[data-add-toolbox]');
    if (addToolbox && action !== 'add-section' &&
        !document.querySelector('#evidence > .ev-section')) {
      var root = document.getElementById('evidence');
      var firstSection = makeSection('');
      root.insertBefore(firstSection, addToolbox);
      renumber();
      alignProps();
    }
    var section = sectionForAction(actionBtn);
    var body = section ? section.querySelector(':scope > .ev-body') : null;
    if (!body) return;
    // 0107–0109 (SPEC §29): row-toolbox adds insert after the triggering row;
    // section-toolbox adds append at the end of the body, as before.
    var addAnchor = afterAddRow(actionBtn);
    var placeAfter = function (node) {
      if (addAnchor) addAnchor.insertAdjacentElement('afterend', node);
      else body.appendChild(node);
    };
    if (action === 'add-subsection') {
      addSection(body);
      return;
    }
    if (action === 'add-comment') {
      var commentRow = makeComment();
      placeAfter(commentRow);
      renumber();
      alignProps(); // 0036 (§18)
      focusTextFieldAtEnd(firstEditableInRow(commentRow));
      return;
    }
    if (action === 'add-code') {
      var codeRow = makeCode('');
      placeAfter(codeRow);
      renumber();
      alignProps();
      focusTextFieldAtEnd(firstEditableInRow(codeRow));
      return;
    }
    if (action === 'add-property') {
      var propertyRow = makeProperty('', '');
      placeAfter(propertyRow);
      renumber();
      alignProps(); // 0036 (§18)
      focusTextFieldAtEnd(firstEditableInRow(propertyRow));
      return;
    }
    if (action === 'add-file') {
      return addFile(body, addAnchor, operation);
    }
    if (action === 'add-url') {
      var urlRow = makeUrlRow();
      placeAfter(urlRow);
      renumber();
      alignProps();
      focusTextFieldAtEnd(urlRow.querySelector(':scope > .ev-url-editor > .ev-url-input'));
      return;
    }
    if (action === 'edit') {
      var editRow = rowForAction(actionBtn);
      if (!editRow || !editRow.matches('.ev-url')) return;
      startUrlEditing(editRow);
      return;
    }
    if (action === 'standalone') {
      // 0051 (SPEC §23): a pure boolean on the shot — on gives its flex
      // item box the full line (CSS), the image keeps its own size; off
      // restores the previous layout. No state bookkeeping anywhere else.
      var standaloneShot = rowForAction(actionBtn);
      if (standaloneShot) {
        if (standaloneShot.hasAttribute('data-standalone')) standaloneShot.removeAttribute('data-standalone');
        else standaloneShot.setAttribute('data-standalone', '');
        updateScreenshotMetadataWidth(standaloneShot);
        // Toggling changes the handle's containing block (item box vs the
        // standalone grid area), so the stored offset must be re-derived.
        updateScreenshotHandlePosition(standaloneShot);
        if (standaloneShot.hasAttribute('data-standalone')) actionBtn.setAttribute('data-active', 'true');
        else actionBtn.removeAttribute('data-active');
        refreshSharedPaletteState(standaloneShot, sharedSectionPalette());
      }
      return;
    }
    if (action === 'soft-wrap') {
      var codeSnippet = rowForAction(actionBtn);
      if (codeSnippet) {
        codeSnippet.toggleAttribute('data-soft-wrap');
        actionBtn.setAttribute('aria-pressed', codeSnippet.hasAttribute('data-soft-wrap') ? 'true' : 'false');
        if (codeSnippet.hasAttribute('data-soft-wrap')) actionBtn.setAttribute('data-active', 'true');
        else actionBtn.removeAttribute('data-active');
      }
      return;
    }
    if (action === 'delete') {
      return deleteElement(actionBtn, operation);
    }
    if (action === 'rename-file') {
      return renameFile(actionBtn, operation); // 0066 (§27): prompt → OK → ensurePermission → rename
    }
    if (action === 'copy') {
      return copyField(actionBtn, operation);
    }
    if (action === 'open-image') {
      var imageScreenshot = rowForAction(actionBtn);
      var image = imageScreenshot && imageScreenshot.querySelector(':scope > img.ev-img');
      if (image && image.src) window.open(image.src, '_blank', 'noopener,noreferrer');
      return;
    }
    if (action === 'copy-element') {
      copyElement(actionBtn, operation);
      return;
    }
    if (action === 'paste-after') {
      pasteAfter(actionBtn, operation);
      return;
    }
    if (action === 'paste-here') {
      pasteHere(actionBtn, operation);
      return;
    }
    if (action === 'size-small' || action === 'size-medium' || action === 'size-large' ||
        action === 'size-page-width' || action === 'size-original' ||
        action === 'size-larger' || action === 'size-smaller') {
      var screenshot = rowForAction(actionBtn);
      if (screenshot) applyScreenshotSize(screenshot, action.slice('size-'.length));
      if (screenshot) refreshSharedPaletteState(screenshot, sharedSectionPalette());
      return;
    }
    if (action === 'add-screenshot') {
      // exactly one pending placeholder at a time: a new click removes the old one (SPEC §6.1)
      var old = document.querySelector('#evidence .ev-screenshot-pending');
      if (old) old.remove();
      if (addAnchor) {
        // 0107–0110 (SPEC §29 placement table): screenshot-row adds stay in
        // that row, image adds stay after the image, and other row adds join
        // a following screenshot row when present or follow their owner.
        if (addAnchor.matches('.ev-shot-row')) {
          addAnchor.appendChild(makeScreenshotPending());
          return;
        }
        if (addAnchor.matches('.ev-screenshot')) {
          addAnchor.insertAdjacentElement('afterend', makeScreenshotPending());
          return;
        }
        var nextRow = addAnchor.nextElementSibling;
        var followingShotRow = nextRow && nextRow.matches('.ev-shot-row') ? nextRow : null;
        if (followingShotRow) followingShotRow.appendChild(makeScreenshotPending());
        else addAnchor.insertAdjacentElement('afterend', makeScreenshotPending());
        return;
      }
      // 0051 (SPEC §23.1/§6.1): the placeholder joins the section's last row
      // (at the row's end), or sits at the end of the body as a plain shot
      // when the section has no rows — a paste then creates that plain row.
      var lastRow = null;
      [...body.querySelectorAll(':scope > .ev-shot-row')].forEach(function (row) { lastRow = row; });
      (lastRow || body).appendChild(makeScreenshotPending());
      return;
    }
  }

  function closePaletteAfterActionClick(event) {
    var actionBtn = event.target.closest ? event.target.closest('[data-action]') : null;
    var palette = event.target.closest ? event.target.closest('[data-section-palette]') : null;
    if (actionBtn && palette && !palette.hasAttribute('data-palette-inert')) closeSectionPalette();
  }

  // 0058/0117: mouse presses on code/file add controls do not move focus to the
  // button before the action. Code creation then focuses its new editor; the
  // file picker leaves the current field alone. Keyboard activation stays native.
  function onDocumentMouseDown(event) {
    var preserving = event.target.closest
      ? event.target.closest('[data-action="add-code"], [data-action="add-file"]')
      : null;
    if (preserving) event.preventDefault();
  }

  // 0018: plain-text editing (SPEC §8)

  function editableAt(event) {
    var target = event.target;
    return target && target.closest ? target.closest(EDITABLE_SELECTOR) : null;
  }

  // 0036 (§18): the live, per-keystroke recompute. Only property keys
  // trigger it — a value edit sits right of the colon and cannot move the
  // column. Paste into a key lands here too (execCommand's insertText
  // fires the input event).
  function onDocumentInput(event) {
    var urlEditor = urlEditorFor(event.target);
    if (urlEditor) {
      updateUrlDisplayFromInputs(urlEditor.closest('.ev-url'));
      return;
    }
    var editing = editableAt(event);
    if (editing && (editing.classList.contains('ev-comment-text') ||
        editing.classList.contains('ev-code-text') ||
        editing.classList.contains('ev-prop-key') ||
        editing.classList.contains('ev-prop-value'))) {
      updatePrintVisibility(editing.closest('.ev-comment, .ev-code, .ev-property'));
    }
    if (editing && editing.classList.contains('ev-prop-key')) alignProps();
    if (editing && editing.classList.contains('ev-prop-value')) updatePropertyValueAlignment();
    if (editing && editing.classList.contains('ev-doc-title-text')) syncTabTitle(); // 0039 (§19)
    // 0044 (§21): a section-title edit re-renders the tree so the entry's
    // label (number + title) stays in sync; the panel state is untouched
    if (editing && editing.classList.contains('ev-title-text')) renderToc();
    if (editing && editing.classList.contains('ev-caption')) {
      var screenshot = editing.closest('.ev-screenshot');
      var img = screenshot && screenshot.querySelector(':scope > img.ev-img');
      if (img) img.alt = editing.textContent || '';
    }
  }

  function onDocumentPaste(event) {
    var hasPendingScreenshot = !!document.querySelector('#evidence .ev-screenshot-pending');
    var hasImage = event.clipboardData && event.clipboardData.items &&
      [...event.clipboardData.items].some(function (item) {
        return String(item.type || '').indexOf('image/') === 0;
      });
    var screenshotPaste = hasPendingScreenshot && hasImage;
    return runOperation(screenshotPaste ? 'Paste screenshot' : 'Paste',
      screenshotPaste ? 'Paste screenshot completed' : 'Paste completed', function (operation) {
        return dispatchDocumentPaste(event, operation);
      });
  }

  function dispatchDocumentPaste(event, operation) {
    var clipboard = clipboardDataPayload(event.clipboardData);
    if (armedPasteTarget) {
      // An external destination is deliberately single-use. Consume every
      // native paste while it is armed, including malformed or unrelated
      // clipboard data, so the destination cannot accidentally survive for a
      // later paste and no other paste workflow can add content through it.
      event.preventDefault();
      var target = armedPasteTarget;
      clearArmedPasteTarget();
      if (!clipboard.recognized || !clipboard.payload) {
        completeOperation(operation, 'Paste failed — clipboard content is not a valid element', 'error');
        return;
      }
      applyPasteTarget(target, Object.freeze(clipboard.payload), operation);
      return;
    }
    if (clipboard.recognized) {
      // The structured fallback is only meaningful for an explicitly armed
      // external target. Never let its text representation enter an editor.
      event.preventDefault();
      completeOperation(operation, clipboard.payload
        ? 'Paste failed — select a paste target first'
        : 'Paste failed — clipboard content is not a valid element', 'error');
      return;
    }
    if (event.clipboardData && event.clipboardData.items) {
      for (var i = 0; i < event.clipboardData.items.length; i++) {
        if (String(event.clipboardData.items[i].type || '').indexOf('image/') === 0) {
          // §6.2: an image/* item AND a pending placeholder → route it there,
          // wherever the paste happens. Otherwise fall through untouched.
          var placeholder = document.querySelector('#evidence .ev-screenshot-pending');
          if (placeholder) {
            event.preventDefault();
            return pasteScreenshot(event.clipboardData.items[i].getAsFile(), placeholder, operation);
            return; // the image is consumed; no text branch
          }
          break;
        }
      }
    }
    var editing = editableAt(event);
    if (!editing || !event.clipboardData) return;
    // rich content never enters the document: default action is prevented and only
    // text/plain is inserted, the same way Enter inserts its newline
    event.preventDefault();
    var plain = event.clipboardData.getData('text/plain');
    if (editing.matches(SINGLE_LINE_SELECTOR)) {
      // 0035: no pasted newline may reach a single-line field — LF, CR and CRLF
      // all collapse to a single space
      plain = plain.replace(/\r\n|\r|\n/g, ' ');
    }
    document.execCommand('insertText', false, plain);
  }

  function onDocumentKeydown(event) {
    var urlEditor = urlEditorFor(event.target);
    if (urlEditor && event.key === 'Enter') {
      event.preventDefault();
      finishUrlEditing(urlEditor.closest('.ev-url'));
      return;
    }
    if (urlEditor && event.key === 'Escape') {
      event.preventDefault();
      cancelUrlEditing(urlEditor.closest('.ev-url'));
      return;
    }
    if (event.key === 'Escape' && (pendingElementCopy || armedPasteTarget)) {
      event.preventDefault();
      pendingElementCopy = null;
      armedPasteTarget = null;
      clipboardSourceElement = null;
      refreshClipboardIndicators();
      var cancelOperation = beginOperation('Cancel clipboard action');
      completeOperation(cancelOperation, 'Clipboard action canceled', 'information');
      if (paletteOwnerTarget()) closeSectionPalette();
      return;
    }
    if (event.key === 'Escape' && drag) {
      // a drag in flight: Esc cancels it, the DOM is unchanged
      event.preventDefault();
      cancelDrag();
      return;
    }
    if (event.key === 'Escape' && exampleMenuOpen) {
      // 0042 (SPEC §20): Esc closes the example dropdown
      setExampleMenu(false);
      return;
    }
    if (event.key === 'Escape' && paletteOwnerTarget()) {
      event.preventDefault();
      closeSectionPalette();
      return;
    }
    if (event.ctrlKey && !event.altKey && !event.metaKey && !event.shiftKey) {
      var key = String(event.key).toLowerCase();
      var shortcutActions = {
        d: 'add-code',
        m: 'add-comment',
        u: 'add-subsection',
        y: 'add-property',
        o: 'add-screenshot',
        l: 'add-file',
        r: 'add-url',
      };
      var action = shortcutActions[key];
      if (key === 'e') action = 'add-section';
      if (action) {
        event.preventDefault();
        if (!event.repeat) {
          var toolbox = document.querySelector('#evidence > [data-add-toolbox]');
          var button = toolbox && toolbox.querySelector(':scope > button[data-action="' + action + '"]');
          if (button && !button.disabled) button.click();
        }
        return;
      }
    }
    var editing = editableAt(event);
    if (editing && event.key === 'Enter') {
      // newline, never a <br>/<div>: default action is prevented and a literal \n is inserted
      event.preventDefault();
      if (editing.matches(SINGLE_LINE_SELECTOR)) {
        // 0035: locked no-op in title/key — nothing inserted, focus stays
        return;
      }
      document.execCommand('insertText', false, '\n');
      return;
    }
    if (editing && (event.ctrlKey || event.metaKey) && 'biu'.includes(String(event.key).toLowerCase())) {
      // no rich formatting inside editables
      event.preventDefault();
      return;
    }
    if ((event.ctrlKey || event.metaKey) && event.key === 's') {
      event.preventDefault();
      var saveButton = document.getElementById('save-btn');
      if (saveButton && !saveButton.disabled) runOperation('Save', 'Save completed', save);
    }
  }

  function bindHandlers() {

    document.addEventListener('copy', onDocumentCopy);

    document.addEventListener('focusout', onDocumentFocusOut);

    document.addEventListener('pointerdown', onDocumentPointerDown);
    document.addEventListener('pointermove', onDocumentPointerMove);

    window.addEventListener('resize', alignEvidenceColumns);
